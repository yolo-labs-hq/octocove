# Secret keys: enc-key, s3-access-key-id, s3-secret-access-key, plus source tokens referenced by tokenFile.
# Copy projected secret symlinks into private files owned by the node user; environment contains paths only.
# Example Kubernetes deployment for nightly mirror, prune and freshness alarms (docs/BACKUP.md).
# Adapt to your own cluster, VM or container scheduler. Image tag/registry are placeholders.
apiVersion: batch/v1
kind: CronJob
metadata: { name: octocove-backup }
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: private-credentials
              image: REGISTRY/octocove-backup:TAG
              command: ["/bin/sh", "-c", "cp -L /input/* /secrets/ && chown 1000:1000 /secrets /secrets/* && chmod 700 /secrets && chmod 600 /secrets/*"]
              securityContext: { runAsUser: 0 }
              volumeMounts: [{ name: credential-source, mountPath: /input, readOnly: true }, { name: credentials, mountPath: /secrets }]
          containers:
            - name: backup
              image: REGISTRY/octocove-backup:TAG
              args: ["run", "--config", "/config/backup.json"]
              env:
                - { name: OCTOCOVE_BACKUP_ENC_KEY_FILE, value: /secrets/enc-key }
                - { name: OCTOCOVE_BACKUP_S3_ACCESS_KEY_ID_FILE, value: /secrets/s3-access-key-id }
                - { name: OCTOCOVE_BACKUP_S3_SECRET_ACCESS_KEY_FILE, value: /secrets/s3-secret-access-key }
              volumeMounts: [{ name: config, mountPath: /config }, { name: work, mountPath: /work }, { name: credentials, mountPath: /secrets, readOnly: true }]
          volumes:
            - { name: credentials, emptyDir: { medium: Memory } }
            - { name: credential-source, secret: { secretName: octocove-backup-credentials, defaultMode: 256 } }
            - { name: config, configMap: { name: octocove-backup-config } }
            - { name: work, emptyDir: {} } # scratch only; use a PVC to keep mirrors between runs (faster incremental fetch)
---
# Prune uses a separate delete-capable credential set; the backup job's credentials cannot delete.
apiVersion: batch/v1
kind: CronJob
metadata: { name: octocove-backup-prune }
spec:
  schedule: "30 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: private-credentials
              image: REGISTRY/octocove-backup:TAG
              command: ["/bin/sh", "-c", "cp -L /input/* /secrets/ && chown 1000:1000 /secrets /secrets/* && chmod 700 /secrets && chmod 600 /secrets/*"]
              securityContext: { runAsUser: 0 }
              volumeMounts: [{ name: credential-source, mountPath: /input, readOnly: true }, { name: credentials, mountPath: /secrets }]
          containers:
            - name: prune
              image: REGISTRY/octocove-backup:TAG
              args: ["prune", "--config", "/config/backup.json"]
              env:
                - { name: OCTOCOVE_BACKUP_PRUNE_S3_ACCESS_KEY_ID_FILE, value: /secrets/s3-access-key-id }
                - { name: OCTOCOVE_BACKUP_PRUNE_S3_SECRET_ACCESS_KEY_FILE, value: /secrets/s3-secret-access-key }
              volumeMounts: [{ name: config, mountPath: /config }, { name: credentials, mountPath: /secrets, readOnly: true }]
          volumes:
            - { name: credentials, emptyDir: { medium: Memory } }
            - { name: credential-source, secret: { secretName: octocove-backup-prune-credentials, defaultMode: 256 } }
            - { name: config, configMap: { name: octocove-backup-config } }
---
# Freshness alarm: a failed Job here is the "newest complete set older than 26h" alert.
apiVersion: batch/v1
kind: CronJob
metadata: { name: octocove-backup-freshness }
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: private-credentials
              image: REGISTRY/octocove-backup:TAG
              command: ["/bin/sh", "-c", "cp -L /input/* /secrets/ && chown 1000:1000 /secrets /secrets/* && chmod 700 /secrets && chmod 600 /secrets/*"]
              securityContext: { runAsUser: 0 }
              volumeMounts: [{ name: credential-source, mountPath: /input, readOnly: true }, { name: credentials, mountPath: /secrets }]
          containers:
            - name: check
              image: REGISTRY/octocove-backup:TAG
              args: ["check", "--config", "/config/backup.json"]
              env:
                - { name: OCTOCOVE_BACKUP_S3_ACCESS_KEY_ID_FILE, value: /secrets/s3-access-key-id }
                - { name: OCTOCOVE_BACKUP_S3_SECRET_ACCESS_KEY_FILE, value: /secrets/s3-secret-access-key }
              volumeMounts: [{ name: config, mountPath: /config }, { name: credentials, mountPath: /secrets, readOnly: true }]
          volumes:
            - { name: credentials, emptyDir: { medium: Memory } }
            - { name: credential-source, secret: { secretName: octocove-backup-credentials, defaultMode: 256 } }
            - { name: config, configMap: { name: octocove-backup-config } }

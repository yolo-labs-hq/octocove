      summary: Read the caller's notification preferences
      description: Human session only, as `GET /me/notifications`. Everything is on by default, so both lists are empty
        until the first `PUT`. `mutedProjects` lists only projects the caller is still a member of, so the answer can
        always be sent back as a `PUT`. Read-only and not audited.

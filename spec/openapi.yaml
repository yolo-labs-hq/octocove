      operationId: meSessionsList
      summary: List the caller's own sign-in sessions
      description: Human session only (cookie or CLI bearer); agent delegations get 403 `human-required` and machine
        grant bearers 401. A session here is one sign-in (a login family), not a rotating session token - renewal keeps
        the same entry. Lists the caller's own sign-ins that are unrevoked, inside their idle and absolute expiries
        and still holding an unrevoked session token (one past its 30-minute expiry still renews), newest first.
        Exactly one item is `current`, the sign-in of the calling session. `id` is an opaque, server-derived identifier usable only with `POST
        /me/sessions/{id}/revoke`; it is never a credential. No `lastSeenAt`, user agent or IP address is recorded
        or returned. Read-only and not audited. Never returns tokens, hashes or CSRF material.
      tags:
      - Auth
      security:
      - HumanSession: []
      - HumanCliSession: []
      responses:
        '200':
          description: The caller's live sign-ins, newest first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeSessionList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authoritative-handler: auth.listFamilies
  /me/sessions/{id}/revoke:
    post:
      operationId: meSessionRevoke
      x-recent-sign-in: true
      summary: Revoke one of the caller's own sign-in sessions
      description: Human session only; Origin and CSRF are checked for cookie callers like every cookie POST. Revokes
        the sign-in, every session token of it, and the bootstraps and delegations authorized through it, in one
        D1 batch with one `auth_family_revocations` row. Revoking the current sign-in is logout, including the
        cookie-expiring `Set-Cookie` headers. Another principal's sign-in and an unknown id both answer the same
        404 `not-found`. An already-revoked sign-in of the caller answers 204 from state; the same session and key
        replay the original 204 for two minutes, even after that session was revoked by the request; the same key
        with another id is `409 idempotency-conflict`.
      tags:
      - Auth
      security:
      - HumanSession: []
      - HumanCliSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: The opaque `id` from `GET /me/sessions`.
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Revoked (or already revoked); empty body.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: Only when the current sign-in was revoked - the session and CSRF cookies, expired, as on logout.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/ReauthRequiredProblem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authoritative-handler: auth.revokeFamily
  /me/delegations:
    get:
      operationId: meDelegationsList
      summary: List the agent grants the caller authorized
      description: Human session only (cookie or CLI bearer); agent delegations and valid machine grant bearers get 403
        `human-required` (an unknown bearer 401). Lists every agent grant (`POST /tasks/{id}/authorizations`) the caller
        authorized from any of their own sign-ins, whatever its status, newest first; another principal's grants are
        never listed. `status` is derived, first match wins - `revoked` (the grant, its delegation token or the
        sign-in it was authorized from was revoked), `expired` (past `expiresAt`, its sign-in past its idle or
        absolute expiry, its five-minute bootstrap passed unused, or its claim was refused or has ended), `pending`
        (authorized, bootstrap not yet consumed), else `active` (its claim granted and active). Keyset pagination with the `GET /tasks` cursor convention, the cursor bound to the
        caller. Read-only and not audited. Never returns tokens, token ids (jti), bootstrap hashes or claim ids.
      tags:
      - Auth
      security:
      - HumanSession: []
      - HumanCliSession: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of the caller's grants, newest first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeDelegationsPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authoritative-handler: auth.listDelegations
  /me/notifications:
    get:
      operationId: meNotificationsList
      summary: List the caller's in-app notifications
      description: 'Human session only (cookie or CLI bearer). Agent delegations get 403 `human-required`, and so do
        machine grant bearers (`ocg_`/`ocsg_`), authenticated with the grant routes'' own lookup first (an unknown one
        is 401). One page of the caller''s own notifications (ADR 0025),
        newest first, and `unreadCount`, read in one batch under the same filter: only rows for projects the caller is
        still a member of (re-checked on every request), and none of a kind or project the caller has muted
        (`GET /me/notification-preferences`). Display fields are joined when read, never copied into the row:
        `projectSlug` and `projectName`, and `taskTitle` (the task''s current intent title) only when the membership
        holds `tasks:read`. `unread=true` lists unread rows only; `unreadCount` is the same either way. `limit=0`
        reads only the count (`items` empty, `nextCursor` null), for the badge poll. Keyset pagination with the
        `GET /tasks` cursor convention, the cursor bound to the caller and `unread`. Read-only and not audited.'
      tags:
      - Auth
      security:
      - HumanSession: []
      - HumanCliSession: []
      parameters:
      - name: unread
        in: query
        description: '`true` for unread rows only. Anything other than `true` or `false` is 400 `invalid-request`.'
        schema:
          type: string
          enum: ['true', 'false']
          default: 'false'
      - name: limit
        in: query
        description: Page size; 0 answers only `unreadCount`.
        schema:
          type: integer
          minimum: 0
          maximum: 100
          default: 50
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of the caller's visible notifications, newest first, and their unread count.

        '200':
          description: Binding is active.
          content: {application/json: {schema: {type: object, required: [trustBindingId, activatedAt], properties: {trustBindingId: {$ref: '#/components/schemas/Id'}, activatedAt: {type: string, format: date-time}}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/ReauthRequiredProblem'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /projects/{project}/approval-trust-bindings/{id}/disable:
    post:
      operationId: approvalTrustDisable
      summary: Permanently revoke one issuer/subject/key binding
      security: [{HumanSession: []}, {HumanCliSession: []}]
      parameters: *machineAdminRecordParameters
      responses: *machineAdminDisableResponses
  /auth/submit-grants:
    post:
      operationId: submitGrantExchange
      summary: Exchange verified proof for a separate one-use exact submission grant
      description: Same configured audience as approval exchange; shared global replay fence. Only the identity bound to the live claim may submit. No approval or landing authority. Proof is verified before any record lookup (uniform 401 for unauthenticated callers); an identical retry recovers the grant record without its token.
      security: [{ApprovalIdentityProof: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SubmitGrantRequest'}}}
      responses:
        '201':
          description: Short-lived opaque submit grant, hash-only outside encrypted retry response.
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/SubmitGrantCredential'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /tasks/{id}/submissions-with-grant:
    post:
      operationId: submitWithGrant
      summary: Consume a submit grant and atomically record immutable submitter provenance
      description: Existing claim eligibility, provisioning and source custody checks still apply; grant consumption is committed with submission. Authenticated exact retries are supported while authority remains valid.
      security: [{SubmitGrant: []}]
      parameters:
      - {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SubmitGrantRequest'}}}
      responses:
        '201':
          description: Recorded submission, including its normal sequence and staging flag.
          content: {application/json: {schema: {type: object, required: [id,seq,staged], properties: {id: {$ref: '#/components/schemas/Id'}, seq: {type: integer}, staged: {type: boolean}}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/submit-grants/{id}/revoke:
    post:
      operationId: submitGrantRevoke
      summary: Human project admin revokes submit authority
      security: [{HumanSession: []}, {HumanCliSession: []}]
      parameters:
      - {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/CsrfToken'}
      responses: *machineAdminDisableResponses

webhooks:
  collaborationEvent:
    post:
      operationId: collaborationEventDelivery
      summary: Receive a signed collaboration event
      description: Octocove sends this request to the registered public HTTPS destination. At least once; duplicates/out-of-order
        possible. Verify timestamp and raw-body HMAC then deduplicate event ID. Retry policy and replay in docs/API.md.
        This is outbound, not an Octocove public POST route.
      tags:
      - Events
      security:
      - WebhookSignature: []
      parameters:
      - name: Octocove-Event-Id
        in: header
        required: true
        schema:
          type: string
        description: Stable tenant/audit event identity, including on replay.
      - name: Octocove-Delivery-Id
        in: header
        required: true
        schema:
          type: string
        description: Unique delivery attempt ID.
      - name: Octocove-Timestamp
        in: header
        required: true
        schema:
          type: string
        description: Unix seconds; accept within five minutes.
      - name: Octocove-Signing-Key-Id
        in: header
        required: true
        schema:
          type: string
        description: Exactly one named signing generation; initial before first rotation. Select only this key, reject expired previous keys, never silently try both.
      - name: Octocove-Signature
        in: header
        required: true
        schema:
          type: string
        description: v1=<hex HMAC-SHA256(secret, timestamp + dot + rawBody)>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '204':
          description: Acknowledged; any 2xx also acknowledges.
        '400':
          description: Rejected delivery; non-2xx is retried up to 24 hours then parked.

components:
  securitySchemes:
    EventIdentityProof:
      type: http
      scheme: bearer
      bearerFormat: Machine signed assertion
      description: ADR-0009 registered workload or bot; exact event-authority audience, at most 300 seconds, live project-scoped permission. Never a human session or approval grant.
    SubmitGrant: {type: http, scheme: bearer, bearerFormat: Opaque Octocove submit grant, description: One exact source submission and owned live attempt; never approval or landing authority. Also identifies its principal at `GET /me`.}
    ApprovalIdentityProof:
      type: http
      scheme: bearer
      bearerFormat: Verified issuer JWT or registered-key assertion
      description: Exchange only; ADR 0001 (machine exact-approval authority) issuer/audience/expiry/replay checks mandatory.
    ApprovalGrant:
      type: http
      scheme: bearer
      bearerFormat: Opaque Octocove approval grant
      description: One exact candidate and originating attempt; never submit or land authority. Also identifies its principal at `GET /me`.
    HumanSession:
      type: apiKey
      in: cookie
      name: __Host-octocove_session
      description: Octocove-issued opaque human session; Origin and CSRF protection mandatory on POST.
    HumanCliSession:
      type: http
      scheme: bearer
      bearerFormat: Opaque Octocove session
      description: Human CLI session minted after OIDC/browser confirmation. Never a provider token.
    AgentDelegation:
      type: http
      scheme: bearer
      bearerFormat: Octocove delegation JWT
      description: Octocove issuer/signature, aud octocove; human authorizer/project/task/claim/verbs/expiry/jti
        bindings plus revocation checked. Never human approval authority.
    ClaimBootstrap:
      type: http
      scheme: bearer
      bearerFormat: Opaque Octocove bootstrap
      description: Five-minute single-use human authorization; only bound task claim endpoint, plus exact idempotent
        recovery.
    WebhookSignature:
      type: apiKey
      in: header
      name: Octocove-Signature
      description: Outbound destination verifies HMAC-SHA256 and timestamp; not a public API credential.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on every Octocove POST. Scope/digest/replay rules in docs/API.md.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[!-~]+$
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required with human session cookie on every POST, plus exact allowed Origin. Not needed for bearer-only
        requests.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor scoped to principal and filters.
      schema:
        type: string
    After:
      name: after
      in: query
      description: Opaque exclusive event/audit cursor; omit to start from oldest visible row.
      schema:
        type: string
    CodeRef:
      name: ref
      in: query
      required: false
      description: A full `refs/heads/...` branch (git's ref rules, outside `refs/heads/oc/`, at most 255 characters)
        or a 40/64-hex commit SHA (any case); omitted or empty, the canonical repository's target ref. Anything else
        is 422 `invalid-request` (`details.parameter` `ref`).
      schema:
        type: string
    CodeDirectoryPath:
      name: path
      in: query
      required: false
      description: A directory, `""` (or omitted) for the root. Empty and `.` segments and a trailing `/` are dropped;
        an absolute path, a `..` segment, a NUL, a backslash, more than 4096 bytes or more than 64 segments is 422
        `invalid-request` (`details.parameter` `path`).
      schema:
        type: string
    CodeFilePath:
      name: path
      in: query
      required: true
      description: A file, normalised and refused as `CodeDirectoryPath`; the root is 422.
      schema:
        type: string
        minLength: 1
    ProjectPath:
      name: project
      in: path
      required: true
      description: The project id (`GET /me` memberships).
      schema:
        $ref: '#/components/schemas/Id'
    ProjectId:
      name: projectId
      in: query
      required: true
      description: Authorized project. Agents can only name their bound project.
      schema:
        $ref: '#/components/schemas/Id'
  headers:
    RequestId:
      description: Correlation identifier, no credentials.
      schema:
        type: string
    RetryAfter:
      description: Seconds before retry/poll.
      schema:
        type: integer
        minimum: 1
    CodeCacheControl:
      description: Immutable for a request whose `ref` is a commit SHA; `no-store` for one resolved from a branch.
      schema:
        type: string
        enum:
        - private, max-age=86400, immutable
        - no-store
    NoSniff:
      description: Repository content is data; never sniffed.
      schema:
        type: string
        const: nosniff
    NoStore:
      description: Do not cache auth, collaboration, or secret-bearing responses.
      schema:
        type: string
        const: no-store
  responses:
    ReauthRequiredProblem:
      description: Structured error, as `Problem`. On this operation (`x-recent-sign-in`) a human session whose
        sign-in last authenticated with the identity provider more than the recent sign-in window ago (default one
        hour) also gets 403 `reauth-required`, with `details.authenticatedAt` (that time) and `details.reauthUrl` (the
        browser login start that re-authenticates the same sign-in; docs/AUTH.md "Recent sign-in"). Agent delegations
        and machine callers are never refused this way. ADR 0023.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: Structured error. Codes, refusal details, current boundTo and recovery rules are specified in
        docs/API.md.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ApprovalGrantRequest:
      type: object
      additionalProperties: false
      required:
      - projectId
      - claimAttemptId
      - candidateId
      - boundTo
      - checkRunIds
      properties:
        projectId:
          $ref: "#/components/schemas/Id"
        claimAttemptId:
          $ref: "#/components/schemas/Id"
        candidateId:
          $ref: "#/components/schemas/Id"
        boundTo:
          $ref: "#/components/schemas/BoundTo"
        checkRunIds:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Id"
    ApprovalGrantCredential:
      type: object
      additionalProperties: false
      required:
      - id
      - principalId
      - expiresAt
      - scope
      - policyVersion
      properties:
        id:
          $ref: "#/components/schemas/Id"
        principalId:
          $ref: "#/components/schemas/Id"
          description: Server-resolved canonical principal; clients can check their expected identity.
        token:
          type: string
          description: Returned once, on the exchange that issued the grant; absent from an idempotent retry. Never log.
        expiresAt:
          type: string
          format: date-time
        scope:
          $ref: "#/components/schemas/ApprovalGrantRequest"
        policyVersion:
          type: string
          description: Immutable versioned policy record ID.
    ApproverKind:
      type: string
      enum:
      - human
      - policy_bot
      - workload
    Id:
      type: string
      minLength: 1
      description: Opaque resource identifier. Includes UUIDs, prefixed hashes and provider-assigned IDs; clients must not parse it.
    Sha:
      type: string
      pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
    BoundTo:
      type: object
      additionalProperties: false
      properties:
        candidateSha:
          $ref: '#/components/schemas/Sha'
        baseSha:
          $ref: '#/components/schemas/Sha'
        intentVersion:
          type: integer
          minimum: 1
      required:
      - candidateSha
      - baseSha
      - intentVersion
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: Stable vocabulary in docs/API.md; e.g. stale-base, approval-invalidated, dependency-unlanded,
            conflict.
        detail:
          type: string
        requestId:
          type: string
        details:
          description: Code-specific structured details. `stale-base` sends either no details or
            StaleFenceDetails; every other code sends ProblemDetails. Select a typed view by `code` and
            check it at runtime; tolerate fields not declared here.
          anyOf:
          - $ref: '#/components/schemas/StaleFenceDetails'
          - $ref: '#/components/schemas/ProblemDetails'
      required:
      - type
      - title
      - status
      - code
      - detail
      - requestId
    TaskStatus:
      type: string
      enum:
      - draft
      - ready
      - claimed
      - submitted
      - candidate
      - approved
      - landing
      - landed
      - rejected
      - superseded
    DependencyResult:
      type: object
      additionalProperties: false
      properties:
        upstreamTaskId:
          $ref: '#/components/schemas/Id'
        receiptId:
          $ref: '#/components/schemas/Id'
        landedSha:
          $ref: '#/components/schemas/Sha'
      required:
      - upstreamTaskId
      - receiptId
      - landedSha
    DependencyState:
      type: object
      additionalProperties: false
      properties:
        upstreamTaskId:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/TaskStatus'
        acceptedResult:
          anyOf:
          - $ref: '#/components/schemas/DependencyResult'
          - type: 'null'
      required:
      - upstreamTaskId
      - status
      - acceptedResult
    Intent:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        acceptanceCriteria:
          type: array
          items:
            type: string
      required:
      - title
      - description
      - acceptanceCriteria
    Task:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        projectId:
          $ref: '#/components/schemas/Id'
        key:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        intentVersion:
          type: integer
          minimum: 1
        intent:
          $ref: '#/components/schemas/Intent'
        repositoryId:
          $ref: '#/components/schemas/Id'
        targetRef:
          type: string
        canonicalHeadSha:
          anyOf:
          - $ref: '#/components/schemas/Sha'
          - type: 'null'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DependencyState'
        acceptedReceiptId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        liveAttempt:
          type: object
          additionalProperties: false
          properties:
            claimId:
              anyOf:
              - $ref: '#/components/schemas/Id'
              - type: 'null'
            submissionId:
              anyOf:
              - $ref: '#/components/schemas/Id'
              - type: 'null'
            candidateId:
              anyOf:
              - $ref: '#/components/schemas/Id'
              - type: 'null'
            approvalId:
              anyOf:
              - $ref: '#/components/schemas/Id'
              - type: 'null'
            fenceId:
              anyOf:
              - $ref: '#/components/schemas/Id'
              - type: 'null'
          required:
          - claimId
          - submissionId
          - candidateId
          - approvalId
          - fenceId
        claimedBy:
          description: Who holds the live claim (the claim behind `liveAttempt.claimId`); null when unclaimed.
            Principal ids are disclosed to callers who may read this project's tasks, and only for this project's
            members (ADR 0021). A claimant who no longer holds this project's membership, or an agent whose
            delegation was not authorized in this project, is null here even while the claim is live.
          anyOf:
          - type: object
            additionalProperties: false
            properties:
              id:
                type: string
                minLength: 1
                description: The claimant. A human's `issuer|sub`, or the agent's id.
              kind:
                type: string
                enum: [agent, human]
              delegatedBy:
                type: string
                minLength: 1
                description: Agent claims only. The `issuer|sub` of the human who delegated the claim; omitted
                  while that human holds no membership in this project (ADR 0021).
            required:
            - id
            - kind
          - type: 'null'
        intentEditedAt:
          type: string
          format: date-time
          description: When the current intent version was written; the creation time if the intent was never edited.
        updatedAt:
          type: string
          format: date-time
          description: When the task's own state last changed (a status transition, intent edit, publish, unpublish or closure).
        candidate:
          description: The live candidate (the one behind `liveAttempt.candidateId`) and its aggregate check state; null when there is none.
          anyOf:
          - type: object
            additionalProperties: false
            properties:
              sha:
                $ref: '#/components/schemas/Sha'
              checks:
                type: string
                enum: [passed, failed, running]
                description: '`passed` when the latest check satisfies the candidate''s check policy (always, for a `none` policy); `failed` when the latest recorded check does not; `running` while no check is recorded yet.'
            required:
            - sha
            - checks
          - type: 'null'
        needsReview:
          type: boolean
          description: True when the task waits for a human review, the server's one review predicate, the same one
            `GET /me/projects` counts as `needsReview` (so a project's count equals its listed tasks with
            `needsReview` true). `candidate`, or `approved` with a live approval that no longer holds its candidate,
            base (`canonicalHeadSha`) or intent version, as between a head move and the invalidation of the
            approvals bound to the old head. Clients filter on it rather than re-deriving it.
        reviewReason:
          description: Why `needsReview` is true; null exactly when it is false. `candidate` for a candidate
            awaiting approval, `stale-approval` for an approved task whose approval no longer holds.
          anyOf:
          - type: string
            enum: [candidate, stale-approval]
          - type: 'null'
      required:
      - id
      - projectId
      - key
      - status
      - intentVersion
      - intent
      - repositoryId
      - targetRef
      - canonicalHeadSha
      - dependencies
      - acceptedReceiptId
      - liveAttempt
      - claimedBy
      - intentEditedAt
      - updatedAt
      - candidate
      - needsReview
      - reviewReason
    TasksPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - nextCursor
    CredentialSource:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - artifacts-broker
          - provider-broker
          - lane-gateway
        helper:
          type: string
          enum:
          - octocove-helper-connect
        brokerUrl:
          type: string
          format: uri
        grantId:
          $ref: '#/components/schemas/Id'
        identitySource:
          type: string
          enum:
          - octocove-session
          - octocove-delegation
        scope:
          type: string
          enum:
          - write
          - read
      required:
      - kind
      - brokerUrl
      - grantId
      - identitySource
      - scope
      description: Metadata only, never a provider token. Allocated workspaces require the protected attempt helper and broker grant; no bearer credential helper is offered. Gateway kind requires a validated ref-enforcing gateway.
        All URLs are credential-free.
    ExternalRefSource:
      type: object
      additionalProperties: false
      required: [kind, repositoryId, remote, ref, expectedSha]
      properties:
        kind: {type: string, const: external-ref}
        repositoryId: {$ref: '#/components/schemas/Id'}
        remote: {type: string, description: Credential-free HTTPS or Git SSH remote identity (including git@host:owner/repo.git); server resolves its own canonical fetch URL.}
        ref: {type: string, pattern: '^refs/heads/'}
        expectedSha: {$ref: '#/components/schemas/Sha'}
      description: Registered task canonical identity only; excludes target and reserved refs. No allocation or claimant Git grant. Initial expected SHA is immutable registration evidence; submission may pin a later SHA after integrator fetch verification.
    ExternalCredentialSource:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, const: external}
      description: External writer uses its own existing Git authentication; no broker URL or claimant grant is issued.
    ClaimWorkspace:
      type: object
      additionalProperties: false
      properties:
        mappingId:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
          - task-repo
          - lane-ref
        remote:
          type: string
          format: uri
        ref:
          type: string
        writer: {type: string, const: external}
        repositoryId: {$ref: '#/components/schemas/Id'}
        credentialSource:
          oneOf:
          - $ref: '#/components/schemas/CredentialSource'
          - $ref: '#/components/schemas/ExternalCredentialSource'
      required:
      - mappingId
      - kind
      - remote
      - ref
      - credentialSource
    DelegationCredential:
      type: object
      additionalProperties: false
      properties:
        delegationId:
          $ref: '#/components/schemas/Id'
        accessToken:
          type: string
          description: Octocove-issued task/attempt delegation, never a human OIDC or Artifacts token. Returned
            only by issuance/renewal; redact logs.
        tokenType:
          type: string
          enum:
          - Bearer
        expiresAt:
          type: string
          format: date-time
        revocationId:
          type: string
      required:
      - delegationId
      - accessToken
      - tokenType
      - expiresAt
      - revocationId
    Claim:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        taskId:
          $ref: '#/components/schemas/Id'
        intentVersion:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - active
          - released
          - revoked
          - superseded
          - completed
        expiresAt:
          type: string
          format: date-time
        remote: {type: string, description: Chain remote URL or literal pending.}
        lane: {$ref: '#/components/schemas/ChainLane'}
        dependencyResults:
          type: array
          items:
            $ref: '#/components/schemas/DependencyResult'
        provisioningState:
          description: Ready requires a fetched exact lane ref/commit containing the persisted base pin; external registration also verifies its expected SHA. Platform hints and acceleration subscriptions do not establish readiness.
          type: string
          enum:
          - pending
          - ready
          - blocked
        workspace:
          anyOf:
          - $ref: '#/components/schemas/ClaimWorkspace'
          - type: 'null'
        blockedReason:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - taskId
      - intentVersion
      - status
      - expiresAt
      - dependencyResults
      - provisioningState
      - workspace
      - blockedReason
      description: workspace is non-null iff provisioningState is ready; blockedReason is non-null iff blocked.
        Grant exists before provisioning; broker cannot issue a write credential until ready.
    ClaimResponse:
      type: object
      additionalProperties: false
      properties:
        claim:
          $ref: '#/components/schemas/Claim'
        delegation:
          $ref: '#/components/schemas/DelegationCredential'
      required:
      - claim
      description: delegation is present only on successful bootstrap issuance; exact retry may replay it while
        valid. GET claim never emits credentials.
    SubmissionContext:
      type: object
      additionalProperties: false
      properties:
        intentVersion:
          type: integer
          minimum: 1
        intentTitle:
          type: string
        acceptanceCriteria:
          type: array
          items:
            type: string
        baseSha:
          $ref: '#/components/schemas/Sha'
        canonicalHeadSha:
          anyOf:
          - $ref: '#/components/schemas/Sha'
          - type: 'null'
        actorType:
          type: string
          enum:
          - human
          - agent
        actorId:
          type: string
        claimId:
          $ref: '#/components/schemas/Id'
        dependencyResults:

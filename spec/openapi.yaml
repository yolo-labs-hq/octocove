        candidateRef:
          anyOf:
          - type: string
          - type: 'null'
        baseSha:
          $ref: '#/components/schemas/Sha'
        checkIdentity:
          anyOf:
          - type: string
          - type: 'null'
        checkPolicy:
          type: object
          additionalProperties: true
        latestCheck:
          anyOf:
          - $ref: '#/components/schemas/CheckRun'
          - type: 'null'
        conflictFiles:
          anyOf:

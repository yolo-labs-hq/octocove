    post:
      operationId: repositoryVerify
      x-recent-sign-in: true
      summary: Verify a registered repository against Artifacts so claims and credentials accept it
      description: Human session only (agent delegations get 403 `human-required`); the caller needs `project:admin`
        in the project (403 `forbidden` otherwise). Any project admin may verify. What verification proves - the repository exists in this project's own Artifacts namespace
        (`Project.artifactsNamespace`, `oc-<projectId>`) in this deployment's Artifacts account, with an https remote.
        That is ownership by construction under one assumption - no one outside Octocove's control plane and the
        operator holds a token that can create repositories in `oc-*` namespaces (users and agents only receive
        repo-scoped Git tokens, which cannot cross repositories or namespaces). When it holds, one D1 batch sets
        `repository_verifications.verified_at` and `verified_by` (the caller's principal), appends a
        `repository.verified` audit row and the idempotency ledger row, and rechecks the session, its family and
        the `project:admin` membership (401 `credential-revoked` or 403 `forbidden` when one was lost meanwhile).
        Octocove does not check which holder of such a token created the Artifacts repository, what it contains,
        or that the target ref exists. The target ref head is not read here; the remote sweep records it as an
        `ls-remote` observation once the binding is verified. Refusals - 404 `not-found` (no live repository with
        that id in the project); 409 `repository-provider-unsupported` (GitHub and Forgejo repositories are bound
        by the operator's provider-binding path and are never unverified); 409 `repository-namespace-mismatch` (an
        Artifacts repository outside the project's namespace (ADR 0017), whether registered there, made by a trusted path,
        unverified, trusted or verified - it is never eligible; checked before the
        already-verified and trusted answers and before any Artifacts call, and its verification history is kept); 503 `broker-unavailable` (the Artifacts secrets are not
        installed); 409 `repository-remote-not-found` (Artifacts has no repository at that name in the project's
        namespace); 503 `broker-provider-unavailable` (any other Artifacts failure). An already verified
        repository, or one a trusted path created (`binding` `trusted`), in the project's namespace answers 200 with its current state and
        writes nothing. A replay with the same Idempotency-Key returns the committed 200 before any refusal; the
        same key for another repository is 409 `idempotency-conflict`.

  /auth/login:
    get:
      operationId: authLoginBinding
      servers:
      - url: https://api.example.invalid
        description: Unprefixed browser route at the API origin, outside /v1; it is not mounted under /v1.
      summary: Establish the pre-login browser binding
      description: Sets the random browser binding cookie that scopes the later `POST /auth/login` idempotency and binds
        the callback to this browser, and returns the login endpoint. No Idempotency-Key, no side effect beyond
        the cookie.
      tags:
      - Auth
      security: []
      responses:
        '200':
          description: Binding cookie set.
          headers:
            Set-Cookie:
              description: Secure HttpOnly SameSite=Lax browser binding cookie.
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  loginEndpoint:
                    type: string
                required:
                - loginEndpoint
        '503':
          $ref: '#/components/responses/Problem'
      x-authoritative-handler: auth.bindingCookie
    post:
      operationId: authLogin
      summary: Begin browser or CLI login
      description: Unauthenticated initiation, rate limited; requires Idempotency-Key and allowed Origin for browser
        calls. Browser binding cookie scopes idempotency before login. PKCE S256, state and nonce mandatory. CLI
        flow is Octocove-mediated, not provider device-grant support. Missing live registration returns 503 oidc-registration-required
        with details.registrationRequest; CLI exits 78.


        **Re-authentication (ADR 0023).** With `reauth=1` (the `reauthUrl` of a 403
        `reauth-required`), a browser login refreshes the browser's own sign-in instead of creating one. It needs the
        session cookie of a still renewable sign-in (401 `unauthenticated` otherwise) and `mode` `browser` (400
        `invalid-request` otherwise). The authorization URL asks the issuer for a fresh authentication (`max_age=0`);
        the callback requires the ID token's `auth_time` to be no earlier than this transaction (401 `invalid-id-token`)
        and its identity to be the sign-in's own (400 `invalid-login`), then sets `authenticated_at` to that `auth_time` on the same family,
        replaces the browser's session token and redirects to `return_path`. No second family is created and no other
        session or delegation of the family changes.
      tags:
      - Auth
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      - name: reauth
        in: query
        required: false
        description: '`1` re-authenticates the browser''s current sign-in; any other value is 400 `invalid-request`.'
        schema:
          type: string
          enum: ['1']
      - name: return_path
        in: query
        required: false
        description: With `reauth=1` only - the local path the callback redirects to (default `/`). One leading `/`, then
          printable ASCII without `\` or `#`, at most 512 characters; anything else is 400 `invalid-request`.
        schema:
          type: string
          maxLength: 512
      responses:
        '200':
          description: Login transaction; sensitive response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: Secure HttpOnly SameSite=Lax browser binding/session cookie, or expiry on logout.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authoritative-handler: auth.startLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

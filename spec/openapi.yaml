# ADR 0007: offline binding exports/recovery add no public route, event type or record state.
# Implemented locally and tested on Miniflare and local D1; nothing is deployed. The topology, the integrator runner and Cloudflare Containers are provisional.
openapi: 3.1.0
info:
  title: Octocove API
  version: 0.1.0
  description: Implemented locally and tested on Miniflare and local D1; nothing is deployed. The topology, the integrator runner and Cloudflare Containers are provisional. Agent-independent collaboration records; licensed under Apache-2.0. All Octocove
    collaboration/auth POSTs require Idempotency-Key; broker minting creates a fresh token on each call. Auth scheme acceptance is further restricted by principal/verb and task bindings
    described per operation and in docs/API.md. Issuer proof is accepted only by the dedicated approval/submit grant exchanges; it never authorizes other API verbs. Internal integrator/provider-ingest
    routes are separate contracts.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://api.example.invalid/v1
  description: Placeholder; configure the Octocove API origin. Not a deployed service.
tags:
- name: Tasks
  description: Intent contracts and accepted dependency results.
- name: Claims
  description: Authorized claim attempts and isolated workspace provisioning.
- name: Submissions
  description: Immutable submitted commits and context.
- name: Candidates
  description: Compute evidence, human approval and fenced landing.
- name: Receipts
  description: Pending landing handles and final immutable reconciliation evidence.
- name: Events
  description: Append-only audit, replay and signed outbound webhooks.
- name: Auth
  description: Octocove sessions, bootstrap and task-scoped agent delegation.
- name: Projects
  description: Self-serve project creation by allow-listed humans, canonical repository registration by
    project admins, and project membership.
security:
- HumanSession: []
- HumanCliSession: []
- AgentDelegation: []
paths:
  /broker/token:
    post:
      operationId: brokerTokenCreate
      summary: Mint a repo-scoped provider Git token from a server-owned claim grant
      description: Owning human claim or exact agent attempt/delegation only, with current membership and
        cookie Origin/CSRF checks. Requests never grant authority. Write requires submissions:create;
        read requires tasks:read. TTL is clamped to the stored 900-second maximum and remaining attempt
        budget with a ten-second provider reserve. Submitted/candidate attempts remain eligible.
        No idempotency key is required; refresh does not revoke its predecessor. Integrator grants are private.
        Under ADR-0005 protected-runtime admission, allocated ref/repo/chain claims never export a provider
        write token. Omitted scope means read; write is refused with 403 `protected-runtime-required`
        (`chain-push-queue-required` for chain claims) before provider I/O and recorded in a sanitized
        admission audit row. Writes go through the attempt helper and gateway proof. Only projects on
        the operator's LEGACY_BROKER_WRITE_PROJECTS migration boundary (never chain) keep an audited
        write export.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [taskId]
                  properties:
                    taskId: {type: string}
                    grantId: {type: string}
                    repo: {type: string, description: "Exact Octocove repository ID requested, never authority."}
                    scope: {type: string, enum: [read, write], description: "Defaults to read; write is refused for allocated claims (protected-runtime-required)."}
                    ttl: {type: integer, minimum: 60}
                - type: object
                  additionalProperties: false
                  required: [origin, path]
                  description: Proposed helper exchange; exact origin/path resolved from authenticated caller's stored remote.
                  properties:
                    origin: {type: string, format: uri, description: "Exact HTTPS origin without trailing slash."}
                    path: {type: string, minLength: 1, description: "Exact URL-encoded pathname without leading slash."}
                    scope: {type: string, enum: [read, write]}
                    ttl: {type: integer, minimum: 60, description: "Requested seconds, clamped to the server grant."}
      responses:
        '201':
          description: Plaintext Git token (read for allocated claims outside the legacy boundary); never persist in logs or collaboration records.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema:
                type: object
                required: [id, token, expiresAt, repo, scope]
                properties:
                  id: {type: string, description: Opaque broker token ID used for revocation.}
                  token: {type: string}
                  credential:
                    type: object
                    additionalProperties: false
                    required: [username, password]
                    description: BYO HTTPS Basic credential; never persist or log.
                    properties:
                      username: {type: string}
                      password: {type: string}
                  expiresAt: {type: string, format: date-time}
                  repo: {type: string}
                  scope: {type: string, enum: [read, write]}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /broker/token/{id}:
    delete:
      operationId: brokerTokenRevoke
      summary: Revoke only a provider token owned by the authenticated principal
      description: Ownership survives session/delegation rotation; another principal's token returns 404.
        Cookie requests require Origin/CSRF. Repeated successful revocation returns 204.
      tags: [Auth]
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '204':
          description: Owned token revoked.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /broker/push/{taskId}:
    post:
      operationId: brokerHelperPush
      summary: Deliver one protected-runtime helper push, gated by a runtime push proof, to the claim's own task repository
      description: ADR-0005 repo-lane write delivery. Owning human claim or exact agent attempt/delegation, plus the runtime push proof
        `X-Octocove-Runtime-Proof`, an ES256 JWT (`typ` `octocove-push-proof+jwt`) signed by a runtime key the
        operator registered for the project in HELPER_RUNTIME_PUBLIC_JWKS, over the exact push
        {v, project, task, claim, grant, repo, ref, old, new, bodyDigest} with audience OCTOCOVE_ISSUER, a
        lifetime of at most 120 seconds and a single-use `jti`. The body is one receive-pack v1 command for the
        mapping's working ref followed by its pack (at most 8 MiB). Only allocated task-repository (repo-lane)
        claims qualify; ref lanes are refused with `gateway-proof-required` and chain lanes with
        `chain-push-queue-required`. The nonce is consumed before provider I/O; the server mints, uses and
        revokes a 60-second provider write token for that task repository and returns only the upstream
        report-status. Refusals append a sanitized broker admission audit row. No idempotency key; a replayed
        proof returns 403 `proof-replayed`.
      tags: [Auth]
      parameters:
      - name: taskId
        in: path
        required: true
        schema: {type: string}
      - name: X-Octocove-Runtime-Proof
        in: header
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/x-git-receive-pack-request:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Upstream receive-pack report-status for the admitted push (written or rejected by Git).
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/x-git-receive-pack-result:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /tasks:
    get:
      operationId: tasksList
      summary: List visible tasks
      description: Humans need project read permission. Agent tasks:list returns only the bound task. Keyset pagination
        by task ID.
      tags:
      - Tasks
      security:
      - HumanSession: []
      - HumanCliSession: []
      - AgentDelegation: []
      responses:
        '200':
          description: Visible tasks.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authoritative-handler: task-list.listTasks
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/TaskStatus'
    post:
      operationId: taskCreate
      summary: Create a draft task
      description: Human `tasks:create` only. The task id is derived from `(projectId, key)`, so a repeated key is a
        replay. `repositoryId`/`targetRef` must be a registered canonical target of the project (404 otherwise);
        every `dependsOn` task must exist in the project. Creates intent version 1 in status `draft`.
      tags:
      - Tasks
      security:
      - HumanSession: []
      - HumanCliSession: []
      responses:
        '201':
          description: Draft task with intent version 1.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  id:
                    $ref: '#/components/schemas/Id'
                  intentVersion:
                    type: integer
                  status:
                    $ref: '#/components/schemas/TaskStatus'
                required:
                - id
                - intentVersion
                - status
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authoritative-handler: lifecycle.create
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Intent'
              - type: object
                properties:
                  changeNote:
                    type: string
                  projectId:
                    $ref: '#/components/schemas/Id'
                  repositoryId:
                    $ref: '#/components/schemas/Id'
                  targetRef:
                    type: string
                  key:
                    type: string
                    minLength: 1
                  dependsOn:
                    type: array
                    items:
                      $ref: '#/components/schemas/Id'
                required:
                - projectId
                - repositoryId
                - targetRef
                - key
  /me:
    get:
      operationId: meGet
      summary: Read the authenticated principal and its project memberships
      description: Any authenticated human session (cookie or CLI bearer), agent delegation, or machine grant
        bearer (an unspent `ocg_` approval or `ocsg_` submit grant from the machine-authentication exchanges, with live
        authority); anonymous callers get the 401 problem. No new credential is accepted - sessions and delegations
        use the gateway's authentication and grants the grant routes' own lookup - so a raw signed machine
        assertion (exchange-only) and a one-use claim bootstrap are refused with 401 like any unknown bearer.
        Memberships are every `auth_memberships` row for the resolved (issuer, sub), ordered by project ID - the
        human's own, a delegation's delegating human's, and for a machine grant its bound human (human approval
        principal) or the principal itself under issuer `urn:octocove:machine`. Verbs are returned exactly as stored,
        sorted; an empty list is a valid answer. Each membership also carries its project's `slug`, `name` and
        `artifactsNamespace` (null for a legacy project without one), read in the same query; they describe the project
        and grant nothing. `capabilities.createProjects` reports whether `POST /projects` would
        pass its `PROJECT_CREATORS` gate for this caller (the same check; false for delegations and machine grants).
        A human also gets `profile` (ADR 0026), the fields `PATCH /me/profile` sets, `name` falling back to the
        identity provider's display name.
        Memberships describe the identity; they never widen what a delegation or grant may do. Read-only and not
        audited, like `GET /tasks`. Never returns tokens, hashes, CSRF or verifier material, recovery ciphertext or
        cookie values.
      tags:
      - Auth
      security:
      - HumanSession: []
      - HumanCliSession: []
      - AgentDelegation: []
      - ApprovalGrant: []
      - SubmitGrant: []
      responses:
        '200':
          description: The authenticated principal, the credential kind it presented and its memberships.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authoritative-handler: me.me
  /me/profile:
    patch:
      operationId: meProfileUpdate
      summary: Edit the caller's own profile
      description: Human session only; agent delegations get 403 `human-required` and a valid machine grant bearer 403
        `human-required` from the handler (an unknown one 401). Origin and CSRF are checked for cookie callers, as on
        every cookie POST. Sets the named fields of the caller's profile (ADR 0026); email stays the identity
        provider's and the principal id never changes. The profile is stored apart from the sign-in record, so signing
        in again never erases it. One D1 batch upserts the named fields and appends one `profile.updated` audit row
        (no project, so it is in neither `GET /audit` nor `GET /events`; refs the principal id and the names of the
        fields set, never their values) and the idempotency ledger row, behind an in-transaction recheck of the
        calling session (401 `credential-revoked` when it was revoked meanwhile). A body naming no field writes
        nothing and answers the current profile. A replay with the same Idempotency-Key returns the committed answer;
        the same key with another body is 409 `idempotency-conflict`.
      tags:
      - Auth
      security:
      - HumanSession: []
      - HumanCliSession: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: The caller's profile after the edit (or the committed answer to a replay of the same key).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authoritative-handler: profile.updateProfile
  /me/projects:
    get:
      operationId: meProjectsList
      summary: Summarise each of the caller's projects for the dashboard
      description: 'Human session only (cookie or CLI bearer). Agent delegations get 403 `human-required`, and so do
        machine grant bearers (`ocg_`/`ocsg_`): they are authenticated with the grant routes'' own lookup first (an
        unknown or spent one is 401) and then refused; a delegation is confined to one task and a grant to its own
        routes, and neither has a dashboard. One item per membership of the caller, in `GET /me` order (by project
        ID), carrying exactly the identity fields `GET /me` memberships carry (`projectId`, `slug`, `name`,
        `artifactsNamespace`; verbs are not repeated). `taskCounts` counts the project''s tasks by `status`, one key
        per task status the lifecycle writes, zeros included: `draft`, `ready`, `claimed`, `submitted`, `candidate`,
        `approved`, `landing`, `landed`, `rejected`, `superseded`. There is no `closed` status: a closed task is
        `rejected` or `superseded`, and `submitted` (awaiting its candidate) and `landing` (approved, fenced, being
        landed) are states of their own. `needsReview` is the number of the project''s tasks whose `GET /tasks`
        item has `needsReview` true (one server predicate, the review queue''s filter): `candidate`, or `approved`
        with a live approval that no longer holds
        its candidate, base (the target ref''s current head) or intent version, as between a head move and the
        invalidation of the approvals bound to the old head. `repository.verification` is the
        `verification` `GET /projects/{project}/repositories` reports for the project''s first canonical repository
        (same expression), and `repository` is null when the project has no live canonical repository with a
        target ref. Both underlying reads require `tasks:list`; a membership without it reports `taskCounts`,
        `needsReview` and `repository` as null. A constant three statements in one batch, whatever the number of
        projects. Read-only and not audited.'
      tags:
      - Auth
      security:
      - HumanSession: []
      - HumanCliSession: []
      responses:
        '200':
          description: One summary per membership of the caller.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeProjectList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      x-authoritative-handler: me.meProjects
  /projects:
    post:
      operationId: projectCreate
      x-recent-sign-in: true
      summary: Create a project and the creator's membership
      description: Human session only (agent delegations get 403 `human-required`). Provisional bootstrap rule
        (docs/AUTH.md) - the caller's `issuer|sub` must be listed in the deployment's `PROJECT_CREATORS` Worker
        secret; while it is unset or empty, or the caller is not listed, every request gets 403
        `project-create-disabled`. One D1 batch inserts the project (`createdBy` is the caller) with its own Artifacts
        namespace `artifactsNamespace` (`oc-<id>`, unique, immutable, never reused; no Artifacts call - Artifacts
        creates the namespace with its first repository), the caller's
        `auth_memberships` row with every verb the control plane checks (including `project:admin`; delegated
        land off) and the `project.created` audit row; the membership appears in `GET /me` immediately. A replay
        with the same Idempotency-Key and body returns the committed 201; the same key with another body is 409
        `idempotency-conflict`. A slug already in use is 409 `slug-taken`; an off-shape body is 400 `invalid-request`;
        a slug shaped like a UUID (8-4-4-4-12 hex digits, any case), which could shadow a project id route, is 422
        `invalid-slug`.
        The batch rechecks the session and its family, so a create racing a logout or revocation commits nothing
        (401 `credential-revoked`). The same batch counts the projects the caller created, so a caller already at
        the deployment's per-creator cap (`PROJECT_CREATE_MAX_PER_CREATOR`, default 20) gets 403
        `project-quota-exceeded` (`details.limit`) even under concurrency. Admitted attempts are throttled per
        principal (a burst of 10, then one per minute) with 429 `rate-limited` and `Retry-After`. A replay of a
        committed key is answered before either. No repository or target ref is bound and no other member is invited.
      tags:
      - Projects
      security:
      - HumanSession: []
      - HumanCliSession: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: The created project (or the committed answer to a replay of the same key and body).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/ReauthRequiredProblem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authoritative-handler: projects.createProject
  /projects/{project}/repositories:
    post:
      operationId: repositoryCreate
      x-recent-sign-in: true
      summary: Create, import or register the project's canonical repository and target ref
      description: Human session only (agent delegations get 403 `human-required`); the caller needs `project:admin`
        in the project (403 `forbidden` otherwise). Three modes share the authority, the idempotency ledger, the
        one-canonical rule and the `Repository` answer.


        **Create and import (`mode` `create` or `import`; ADR 0018)** - Octocove itself creates the repository in
        the project's own Artifacts namespace - an empty one (`create`, default branch = the target ref's branch) or
        one imported from a public HTTPS Git remote (`import`; the target ref defaults to `refs/heads/<branch>`, else
        `refs/heads/main`). `name` must match Artifacts' `^[a-zA-Z0-9][a-zA-Z0-9._-]*$` (and the 1-120 character
        rules). An import `url` must be `https:` with a public host (no private, loopback, link-local, CGNAT,
        multicast or unspecified IP literal, v4 or v6 including v4-mapped; no single-label, `localhost`, `.local`,
        `.internal` or other special-use name) and no userinfo, query or fragment (400 `repository-import-url-invalid`,
        before anything is written or called); no credentials are ever sent to a source. Artifacts, not Octocove,
        resolves and fetches the URL, so DNS rebinding and redirects are Artifacts' to enforce. A recorded creation
        intent reserves the address (namespace + name) before Artifacts is read and called; a registration of a
        reserved address is 409 `repository-creation-pending`. The Artifacts call runs before the D1 batch that
        records the repository. Octocove never deletes an Artifacts repository on its own - after an ambiguous
        answer or a failed batch, a cron sweep records the repository when the intent proves this request created it
        (then a retry with the same Idempotency-Key answers the 201), and otherwise leaves the intent for the
        operator (`needs-operator`, audited as `repository.creation_needs_operator`). Refusals - 409
        `canonical-exists`; 409 `repository-taken` (the address is already recorded, a repository already exists
        there in Artifacts, or Artifacts answers 409 - that repository is never touched); 409
        `repository-creation-pending` (another create for this project is in flight, or an open creation reserves
        this address - retry later); 400 `repository-import-refused` (Artifacts refused the import, for example an
        Artifacts remote as source, 10104); 503 `broker-unavailable` (the deployment has no Artifacts secrets); 503
        `broker-provider-unavailable` (any other Artifacts failure; the creation may still complete and be recorded
        by the sweep). The
        repository is born verified (a trusted path - `repositoriesList` reports `verified`, `repositoryVerify`
        answers binding `trusted`). An import answers importState `importing`; claims refuse 409
        `repository-importing` until Artifacts reports the repository populated (reconciled on `repositoriesList`
        and by the sweep), and 409 `repository-import-failed` once it settled `failed`. The repo token Artifacts
        returns is never stored or answered.


        **Registration (no `mode`, or `mode` `register`)** - registers an existing Artifacts repository as the project's
        canonical repository with one target ref (default `refs/heads/main`). The repository must live in the
        project's own Artifacts namespace (`Project.artifactsNamespace`) - an omitted `namespace` defaults to it, and
        any other is 409 `repository-namespace-mismatch` before anything is written (after the replay of a committed
        key). Nothing is fetched from the provider -
        without `knownHeadSha` the ref is unpinned and readers report the head as unavailable; with it the head is
        recorded as a `seed` observation. One D1 batch inserts the `repositories` row (role `canonical`), the
        `target_refs` row, the `repository.registered` and `target_ref.registered` audit rows and the idempotency
        ledger row, and rechecks the session, its family and the `project:admin` membership (401
        `credential-revoked` or 403 `forbidden` when one was lost meanwhile). One canonical repository per project
        - a second is 409 `canonical-exists`; an Artifacts namespace and name (the address every downstream
        path uses), or a `(provider, namespace, repoId)`, already registered (for example by a task fork in the same
        namespace) is 409 `repository-taken`; an address an open repository creation reserves is 409
        `repository-creation-pending`; an
        off-shape body is 400 `invalid-request`. The registered repository is unverified - claims, provisioning and
        broker credentials refuse it with 409 `repository-unverified` until it is verified (`repositoryVerify`). A replay with the same
        Idempotency-Key and body returns the committed 201 before any refusal; the same key with another body is
        409 `idempotency-conflict`.
      tags:
      - Projects
      security:
      - HumanSession: []
      - HumanCliSession: []
      parameters:
      - $ref: '#/components/parameters/ProjectPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:

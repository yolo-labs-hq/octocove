                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authoritative-handler: notification-routes.getNotificationPreferences
    put:
      operationId: meNotificationPreferencesPut
      summary: Replace the caller's notification preferences
      description: Human session only, as `GET /me/notifications`; Origin and CSRF are checked for cookie callers.
        Replaces both lists, deduplicated and sorted; they apply at once to the list and to `unreadCount`, and no
        notification row is rewritten. An unknown kind is 400 `invalid-request` (`details.mutedKinds`); so is a project
        the caller is not a member of (`details.mutedProjects`, the ids as sent), the same answer whether or not the
        project exists. The preferences, one `notification_preferences.updated` audit row (refs `principalId`,
        `mutedKinds`, `mutedProjects`; ids only and no project, so no project's `/audit` or `/events` serves it) and
        the ledger row commit in one D1 batch. A replay with the same Idempotency-Key answers the committed body; the
        same key with another body is 409 `idempotency-conflict`.
      tags:

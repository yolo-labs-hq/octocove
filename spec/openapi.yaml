  /auth/session/renew:
    post:
      operationId: sessionRenew
      summary: Rotate an Octocove human session
      description: Human session only. Session tokens live 30 minutes; the sign-in (login family) lives while it is
        renewed at least once per sliding 14-day idle window, and at most 30 days from OIDC authentication (deployment
        settings may shorten both; docs/AUTH.md). This is the one route that accepts a token past its 30-minute expiry,
        while the token is unrotated and unrevoked and its sign-in is unrevoked, inside its idle expiry and inside its
        absolute expiry; otherwise 401 `credential-expired` (a new OIDC login is required) or `credential-revoked`. Each
        renewal rotates the token and pushes the idle expiry forward, never past the absolute expiry. Cookie response
        omits sessionToken and sets both cookies with Max-Age equal to the remaining idle window; CLI gets bearer. Exact
        predecessor/key retry allowed for two minutes, no other authority; two concurrent same-key renewals both get
        the one rotation's answer. Presenting a token that was already rotated away under any other key, or under the
        same key after those two minutes, is reuse - it revokes the whole sign-in (its session tokens, bootstraps and
        delegations, as logout does), records an `auth_family_revocations` row with reason `token-reuse`, and answers
        401 `credential-revoked`. Clients must single-flight renewal per token (ADR 0019).
      tags:
      - Auth
      security:
      - HumanSession: []
      - HumanCliSession: []
      responses:
        '200':
          description: Rotated Octocove session.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: Cookie callers only. `__Host-octocove_session` (Secure; HttpOnly; SameSite=Lax; Path=/) and
                `__Host-octocove_csrf` (Secure; SameSite=Lax; Path=/), each with Max-Age equal to the seconds left until
                `idleExpiresAt`, so they survive a browser restart.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authoritative-handler: auth.renewSession
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
  /auth/logout:
    post:
      operationId: authLogout
      summary: Log out the session family
      description: Human session only. Revoke family, bootstraps and delegations authorized by it, expire cookie.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeNotificationsPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authoritative-handler: notification-routes.listNotifications
  /me/notifications/read:
    post:
      operationId: meNotificationsMarkRead
      summary: Mark the caller's notifications read
      description: Human session only, as `GET /me/notifications`; Origin and CSRF are checked for cookie callers.
        `{ids}` marks the named rows, `{upTo}` every row up to and including that id. Only the caller's own rows that
        `GET /me/notifications` would list (a current member, not muted) and that are still unread are stamped;
        anything else named (another principal's row, a hidden or muted one, an unknown id) is ignored, so the 204
        reveals nothing. A mark only sets an unset `readAt`, so it is idempotent by state and keeps no ledger row; a
        replay with the same key answers 204 and changes nothing more. Not audited (read marks are personal state).
      tags:
      - Auth
      security:
      - HumanSession: []
      - HumanCliSession: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'

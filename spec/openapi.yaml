        integratorRunId:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
          - pending
      required:
      - receiptId
      - fenceId
      - integratorRunId
      - status
    LandingsPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Landing'
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - nextCursor
    Landing:
      type: object
      additionalProperties: false
      description: A landed receipt (`GET /receipts/{receiptId}`) with its approval and requesting actor.
      properties:
        receiptId:
          $ref: '#/components/schemas/Id'
        taskId:
          $ref: '#/components/schemas/Id'
        landedSha:
          $ref: '#/components/schemas/Sha'
        candidateSha:
          $ref: '#/components/schemas/Sha'
        baseShaBefore:
          $ref: '#/components/schemas/Sha'
        intentVersion:
          type: integer
          minimum: 1
        landedAt:
          type: string
          format: date-time
          description: The receipt's `reconciledAt`.
        approvedBy:
          type: string
        approvedAt:
          type: string
          format: date-time
        actor:
          type: object
          additionalProperties: false
          description: Who requested the landing (the `landing.fenced` audit actor).
          properties:
            type:
              type: string
              enum:
              - human
              - agent
              - integrator
              - system
              - policy_bot
              - workload
            id:
              type: string
          required:
          - type
          - id
        integratorRunId:
          $ref: '#/components/schemas/Id'
        ancestryVerified:
          type: boolean
      required:
      - receiptId
      - taskId
      - landedSha
      - candidateSha
      - baseShaBefore
      - intentVersion
      - landedAt
      - approvedBy
      - approvedAt
      - actor
      - integratorRunId
      - ancestryVerified
    Receipt:
      type: object
      additionalProperties: false
      properties:
        approverKind:
          $ref: "#/components/schemas/ApproverKind"
        id:
          $ref: '#/components/schemas/Id'
        fenceId:
          $ref: '#/components/schemas/Id'
        taskId:
          $ref: '#/components/schemas/Id'
        candidateId:
          $ref: '#/components/schemas/Id'
        approvalId:
          $ref: '#/components/schemas/Id'
        repositoryId:
          $ref: '#/components/schemas/Id'
        targetRef:
          type: string
        candidateSha:
          $ref: '#/components/schemas/Sha'
        intentVersion:
          type: integer
          minimum: 1
        outcome:
          type: string
          enum:
          - landed
          - raced
          - conflict
          - error
        landedSha:
          anyOf:
          - $ref: '#/components/schemas/Sha'
          - type: 'null'
        baseShaBefore:
          $ref: '#/components/schemas/Sha'
        baseShaAfter:
          $ref: '#/components/schemas/Sha'
        conflictFiles:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
        errorDetail:
          anyOf:
          - type: string
          - type: 'null'
        integratorRunId:
          $ref: '#/components/schemas/Id'
        reconciledAgainstSha:
          $ref: '#/components/schemas/Sha'
        reconciledAt:
          type: string
          format: date-time
        ancestryVerified:
          type: boolean
        eventIdsConsumed:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - fenceId
      - taskId
      - candidateId
      - approvalId
      - repositoryId
      - targetRef
      - candidateSha
      - intentVersion
      - outcome
      - landedSha
      - baseShaBefore
      - baseShaAfter
      - conflictFiles
      - errorDetail
      - integratorRunId
      - reconciledAgainstSha
      - reconciledAt
      - ancestryVerified
      - eventIdsConsumed
      - createdAt
      description: Immutable; landed requires landedSha, fetched-object ancestryVerified=true, and baseShaAfter=reconciledAgainstSha.
        raced requires baseShaBefore != baseShaAfter.
    AuditRow:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          description: D1 audit integer serialized as decimal string to avoid JavaScript precision loss.
        at:
          type: string
          format: date-time
        actorType:
          type: string
          enum:
          - human
          - agent
          - integrator
          - system
          - policy_bot
          - workload
        actorId:
          type: string
        projectId:
          $ref: '#/components/schemas/Id'
        taskId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        type:
          type: string
          description: Closed audit vocabulary in COLLABORATION_RECORD.md section 10.
        refs:
          type: object
          additionalProperties: true
        idempotencyKey:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - at
      - actorType
      - actorId
      - projectId
      - taskId
      - type
      - refs
      - idempotencyKey
    AuditPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditRow'
        nextCursor:
          type: string
      required:
      - items
      - nextCursor
    Event:
      description: The v1 types are fixed. Owned request/completion variants use data.refs.milestone; requested facts identify an immutable request, not a completed mapping or submission. Verification basis A records a request; V records exact fetched proof. The dedicated ADR 0004 names are not v1 types.
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        type:
          type: string
        schemaVersion:
          type: integer
          const: 1
        projectId:
          $ref: '#/components/schemas/Id'
        taskId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        occurredAt:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/AuditRow'
      required:
      - id
      - type
      - schemaVersion
      - projectId
      - taskId
      - occurredAt
      - data
    EventPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        nextCursor:
          type: string
      required:
      - items
      - nextCursor
      description: nextCursor is a signed exclusive domain position bound to authorization and filters; an empty page retains the consumed position.
    Webhook:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        projectId:
          $ref: '#/components/schemas/Id'
        taskId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        url:
          type: string
          format: uri
        types:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - active
          - disabled
        startCursor:
          type: string
      required:
      - id
      - projectId
      - taskId
      - url
      - types
      - status
      - startCursor
    ReplayJob:
      type: object
      additionalProperties: false
      properties:
        jobId:
          $ref: '#/components/schemas/Id'
        webhookId:
          $ref: '#/components/schemas/Id'
        after:
          type: string
        through:
          type: string
        status:
          type: string
          enum:
          - queued
      required:
      - jobId
      - webhookId
      - after
      - through
      - status
    AgentVerb:
      type: string
      enum:
      - tasks:list
      - tasks:read
      - tasks:claim
      - claims:read
      - submissions:create
      - candidates:read
      - candidates:land
      - receipts:read
      - audit:read
      - events:read
    Authorization:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        taskId:
          $ref: '#/components/schemas/Id'
        projectId:
          $ref: '#/components/schemas/Id'
        claimAttemptId:
          $ref: '#/components/schemas/Id'
        delegationId:
          $ref: '#/components/schemas/Id'
        bootstrapToken:
          type: string
        bootstrapExpiresAt:
          type: string
          format: date-time
        authorizationExpiresAt:
          type: string
          format: date-time
        verbs:
          type: array
          items:
            $ref: '#/components/schemas/AgentVerb'
      required:
      - id
      - taskId
      - projectId
      - claimAttemptId
      - delegationId
      - bootstrapToken
      - bootstrapExpiresAt
      - authorizationExpiresAt
      - verbs
      description: Secret response, no-store; five-minute one-use bootstrap, never human credentials.
    LoginRequest:
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          mode:
            type: string
            enum:
            - browser
        required:
        - mode
      - type: object
        additionalProperties: false
        properties:
          mode:
            type: string
            enum:
            - cli
          cliChallenge:
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
        required:
        - mode
        - cliChallenge
    BrowserLogin:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - browser
        authorizationUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
      required:
      - mode
      - authorizationUrl
      - expiresAt
    CliLogin:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - cli
        deviceCode:
          type: string
        userCode:
          type: string
        verificationUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        intervalSeconds:
          type: integer
          minimum: 5
      required:
      - mode
      - deviceCode
      - userCode
      - verificationUrl
      - expiresAt
      - intervalSeconds
    LoginResponse:
      oneOf:
      - $ref: '#/components/schemas/BrowserLogin'
      - $ref: '#/components/schemas/CliLogin'
    Session:
      type: object
      additionalProperties: false
      properties:
        principalId:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: When this session token stops authenticating requests (30 minutes, capped by absoluteExpiresAt).
            Renewal still accepts it until idleExpiresAt.
        idleExpiresAt:
          type: string
          format: date-time
          description: The sign-in ends unless renewed before this (14-day sliding idle window), never after
            absoluteExpiresAt.
        absoluteExpiresAt:
          type: string
          format: date-time
          description: The sign-in's hard cap (30 days from OIDC authentication); a new OIDC login is required after it.
        csrfToken:
          type: string
        sessionToken:
          type: string
          description: Present only for CLI bearer transport; browser receives HttpOnly cookie, never this field.
      required:
      - principalId
      - expiresAt
      - idleExpiresAt
      - absoluteExpiresAt
    MeSession:
      type: object
      additionalProperties: false
      description: One sign-in (login family). No token, hash, CSRF material, user agent or IP address.
      properties:
        id:
          type: string
          description: Opaque, server-derived id; accepted only by `POST /me/sessions/{id}/revoke`, never as a credential.
        current:
          type: boolean
          description: True for the sign-in of the calling session; exactly one item is current.
        createdAt:
          type: string
          format: date-time
          description: When the sign-in authenticated with the identity provider.
        expiresAt:
          type: string
          format: date-time
          description: The sign-in's absolute ceiling; idle session tokens expire earlier unless renewed.
        idleExpiresAt:
          type: string
          format: date-time
          description: The sign-in ends unless renewed before this; each renewal pushes it forward, never past expiresAt.
      required:
      - id
      - current
      - createdAt
      - expiresAt
      - idleExpiresAt
    Member:
      type: object
      additionalProperties: false
      description: One project membership. Profile fields describe the person only; authority is `verbs`.
      properties:
        principalId:
          type: string
          description: The member's `issuer|sub`, the format of `GET /me` `principal.id`.
        displayName:
          type: string
          description: From the identity provider at sign-in; omitted when not stored.
        name:
          type: string
          description: The name to show (ADR 0026) - the member's profile name (`PATCH /me/profile`), falling back to
            `displayName`; omitted when neither exists.
        email:
          type: string
          description: From the identity provider at sign-in; omitted when not stored.
        verbs:
          type: array
          description: The membership's verbs, sorted.
          items:
            type: string
        addedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: When the membership was recorded. Null for a membership recorded before membership management (ADR 0020), other than
            a project creator's (which takes the project's creation time).
      required:
      - principalId
      - verbs
      - addedAt
    MemberList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          description: Ordered by principal.
          items:
            $ref: '#/components/schemas/Member'
      required:
      - items
    MemberAddRequest:
      type: object
      additionalProperties: false
      properties:
        principalId:
          type: string
          description: The person's `issuer|sub` (`GET /me` `principal.id`).
        verbs:
          type: array
          minItems: 1
          description: Verbs to grant, deduplicated and stored sorted. Omitted - the member set (ADR 0020).
          items:
            type: string
      required:
      - principalId
    MeSessionList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MeSession'
      required:
      - items
    NotificationKind:
      type: string
      description: The v1 kinds (ADR 0025). Open for reading; a `PUT` of
        preferences accepts only these.
      enum:
      - review-requested
      - approval-invalidated
      - landed
      - candidate-blocked
      - claim-ended
      - repository-needs-operator
      - member-added
    MeNotification:
      type: object
      additionalProperties: false
      description: One notification of the caller. Ids only are stored; the display fields are joined when read.
      properties:
        id:
          type: string
          pattern: ^ntf_[1-9][0-9]*$
          description: Orders the caller's feed (newest is greatest); what `POST /me/notifications/read` takes.
        kind:
          $ref: '#/components/schemas/NotificationKind'
        projectId:
          type: string
        projectSlug:
          type: string
        projectName:
          type: string
        taskId:
          type: string
          description: Absent for a project-level kind (`repository-needs-operator`, `member-added`).
        taskTitle:
          type: string
          description: The task's current intent title; absent with `taskId`, or when the membership lacks `tasks:read`.
        eventId:
          type: string
          pattern: ^evt_[1-9][0-9]*$
          description: The event it projects, as `GET /events` and webhooks identify it.
        createdAt:
          type: string
          format: date-time
          description: When the event happened.
        readAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - id
      - kind
      - projectId
      - projectSlug
      - projectName
      - eventId
      - createdAt
      - readAt
    MeNotificationsPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MeNotification'
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
        unreadCount:
          type: integer
          minimum: 0
          description: Unread rows under the same filter as `items` (membership and preferences), whatever `unread` is.
      required:
      - items
      - nextCursor
      - unreadCount
    NotificationsMarkReadRequest:
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          ids:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
              pattern: ^ntf_[1-9][0-9]*$
        required:
        - ids
      - type: object
        additionalProperties: false
        properties:
          upTo:
            type: string
            pattern: ^ntf_[1-9][0-9]*$
            description: Marks every row up to and including this id.
        required:
        - upTo
    NotificationPreferences:
      type: object
      additionalProperties: false
      description: Everything is on by default; a kind or project listed here is hidden from the list and the count.
      properties:
        mutedKinds:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/NotificationKind'
        mutedProjects:
          type: array
          maxItems: 1000
          description: Project ids; only projects the caller is a member of.
          items:
            type: string
      required:
      - mutedKinds
      - mutedProjects
    MeDelegation:
      type: object
      additionalProperties: false
      description: One agent grant the caller authorized. No token, token id (jti), bootstrap hash or claim id.
      properties:
        id:
          type: string
          description: The delegation id, as `POST /delegations/{id}/revoke` takes it.
        agent:
          type: string
          description: The `agentId` the grant was authorized for.
        projectId:
          type: string
        taskId:
          type: string
        verbs:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          description: When the grant was authorized (to the second).
        expiresAt:
          type: string
          format: date-time
          description: The grant's ceiling; no delegation token of it outlives this.
        status:
          type: string
          enum: [active, expired, revoked, pending]
          description: Derived at read time; see `meDelegationsList`.
        authorizedViaSession:
          type: string
          description: The `id` `GET /me/sessions` gives the sign-in the grant was authorized from. Listed there only
            while that sign-in is live.
      required:
      - id
      - agent
      - projectId
      - taskId
      - verbs
      - createdAt
      - expiresAt
      - status
      - authorizedViaSession
    MeDelegationsPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MeDelegation'
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - nextCursor
    Me:
      type: object
      additionalProperties: false
      properties:
        principal:
          $ref: '#/components/schemas/MePrincipal'
        credential:
          $ref: '#/components/schemas/MeCredential'
        memberships:
          type: array
          description: Ordered by projectId. Empty when the principal holds no membership.
          items:
            $ref: '#/components/schemas/MeMembership'
        capabilities:
          $ref: '#/components/schemas/MeCapabilities'
        profile:
          $ref: '#/components/schemas/Profile'
      required:
      - principal
      - credential
      - memberships
      - capabilities
    Profile:
      type: object
      additionalProperties: false
      description: Human only (present on `GET /me` for a human, absent for a delegation or machine grant). What the
        person set with `PATCH /me/profile` (ADR 0026); each field is null while unset. `name` falls back to the
        identity provider's display name, so it is null only when neither exists. Email is the provider's
        (`principal.email`) and is not part of the profile.
      properties:
        name:
          type:
          - string
          - 'null'
        pronouns:
          type:
          - string
          - 'null'
        bio:
          type:
          - string
          - 'null'
        timezone:
          type:
          - string
          - 'null'
          description: An IANA time zone name, e.g. `Europe/London`.
      required:
      - name
      - pronouns
      - bio
      - timezone
    ProfileUpdate:
      type: object
      additionalProperties: false
      description: A key present sets that field and `null` clears it; an absent key leaves it unchanged. Strings are
        trimmed before they are checked, and lengths count Unicode code points. No field may contain a control
        character (C0 including tab and newline, DEL, C1). The first invalid field, in the order `name`, `pronouns`,
        `bio`, `timezone`, is 400 `invalid-profile` with `details.field`; any other key is 400 `invalid-request`.
      properties:
        name:
          type:
          - string
          - 'null'
          maxLength: 80
          description: 1-80 code points after trimming (an empty name is invalid; clear it with null).
        pronouns:
          type:
          - string
          - 'null'
          maxLength: 40
          description: At most 40 code points after trimming; empty clears it.
        bio:
          type:
          - string
          - 'null'
          maxLength: 280
          description: At most 280 code points after trimming; empty clears it.
        timezone:
          type:
          - string
          - 'null'
          maxLength: 64
          description: An IANA time zone name the runtime knows (`Europe/London`, `UTC`), never an offset such as
            `+01:00`; stored as `Intl` names it. Empty clears it.
    ProfileResponse:
      type: object
      additionalProperties: false
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
      required:
      - profile
    MePrincipal:
      type: object
      additionalProperties: false
      description: Identity fields only. `human` is the `auth_users` row (`id` is `issuer|sub`); `delegation` is the
        delegation ID with the delegating human's issuer and sub; `machine` is the approval principal ID of a machine
        grant bearer with the policy version its grant pins, and the identity its memberships are read for (its bound
        human for a human approval principal, otherwise issuer `urn:octocove:machine` and the principal ID).
      properties:
        kind:
          type: string
          enum:
          - human
          - delegation
          - machine
        id:
          type: string
        issuer:
          type: string
        sub:
          type: string
        policyVersion:
          type: string
          description: Machine only. The approval policy version the presented grant pins.
        displayName:
          type: string
        email:
          type: string
      required:
      - kind
      - id
    MeCapabilities:
      type: object
      additionalProperties: false
      description: What a route would decide for this caller, answered in advance so a client can render a locked
        step instead of attempting the write. Each flag is computed by the same check the route applies.
      properties:
        createProjects:
          type: boolean
          description: True when `POST /projects` would admit this caller past its bootstrap gate - a human whose
            `issuer|sub` is listed in the deployment's `PROJECT_CREATORS` allow-list. False when the list is unset,
            empty or does not list the caller, and always false for a delegation or machine grant (the route is
            human-only). It does not foresee the per-creator cap, the throttle or a taken slug.
      required:
      - createProjects
    MeCredential:
      type: object
      additionalProperties: false
      description: The kind of credential presented and when it stops authenticating; never the credential itself.
        `session` is the browser cookie, `bearer` a CLI session bearer (human) or a machine grant (machine),
        `delegation` an agent delegation.
        `bootstrap` is reserved and not returned today (a claim bootstrap authenticates only its claim route).
      properties:
        kind:
          type: string
          enum:
          - session
          - bearer
          - delegation
          - bootstrap
        expiresAt:
          type: string
          format: date-time
      required:
      - kind
      - expiresAt
    ProjectCreate:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,62}$
          description: Unique across the deployment. Never shaped like a UUID (8-4-4-4-12 hex digits, any case;
            422 `invalid-slug`), so a slug cannot shadow a project id.
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Display name of 1-120 characters, where a character is one Unicode code point (not a UTF-16
            unit; `maxLength` here counts code points too, as JSON Schema does), so 61 U+1F680 is 61 characters. Refused with 400 `invalid-request`
            when it contains a control character (C0, DEL, C1), a format character (bidi overrides and isolates,
            zero-width characters, U+FEFF, tag characters), a lone surrogate or a line/paragraph separator, or when it has leading
            or trailing whitespace (refused, never trimmed); the one exception is U+200D (zero width joiner) inside an
            emoji ZWJ sequence, i.e. between two pictographic emoji (the first optionally followed by a skin-tone modifier
            or U+FE0F), and such a sequence counts every code point it holds, joiners included.
      required:
      - slug
      - name
    Project:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        slug:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        artifactsNamespace:
          type: string
          readOnly: true
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{1,62}$
          description: The project's own Artifacts namespace, `oc-<id>` (39 characters for a UUID id). Assigned at
            creation, unique across the deployment, immutable and never reused; derived from the id, never the slug.
            The project's repositories must live in it (`repositoryCreate`, `repositoryVerify`). No Artifacts call
            creates it - Artifacts creates a namespace with its first repository.
      required:
      - id
      - slug
      - name
      - createdAt
      - artifactsNamespace
    RepositoryCreate:
      description: One of three modes - register an existing repository (no `mode`, or `register`), create an
        empty one (`create`) or import one (`import`) in the project's own Artifacts namespace.
      oneOf:
      - $ref: '#/components/schemas/RepositoryRegister'
      - $ref: '#/components/schemas/RepositoryCreateEmpty'
      - $ref: '#/components/schemas/RepositoryImport'
    RepositoryCreateEmpty:
      type: object
      additionalProperties: false
      description: Octocove creates an empty Artifacts repository in the project's namespace.
      properties:
        mode:
          type: string
          enum:
          - create
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
          description: The Artifacts repository name to create (Artifacts' rule, observed in error 10101).
        targetRef:
          type: string
          pattern: ^refs/heads/.+
          description: The branch tasks land onto, and the new repository's default branch; `refs/heads/main` when
            omitted. Same rules as a registration's `targetRef`.
      required:
      - mode
      - name
    RepositoryImport:
      type: object
      additionalProperties: false
      description: Octocove imports a public HTTPS Git remote into a new Artifacts repository in the project's
        namespace. Private sources are not supported.
      properties:
        mode:
          type: string
          enum:
          - import
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
          description: The Artifacts repository name to import into.
        url:
          type: string
          maxLength: 2048
          pattern: ^https://[^/@?#\s]+(/[^?#\s]*)?$
          description: A public HTTPS Git remote - `https:` only, a dotted host, no userinfo, no query, no fragment
            (else 400 `repository-import-url-invalid`).
        branch:
          type: string
          maxLength: 255
          description: The source branch to import (Artifacts' `branch`); a valid branch name. Omitted - Artifacts
            imports the source's default.
        targetRef:
          type: string
          pattern: ^refs/heads/.+
          description: The branch tasks land onto; defaults to `refs/heads/<branch>`, else `refs/heads/main`.
      required:
      - mode
      - name
      - url
    RepositoryRegister:
      type: object
      additionalProperties: false
      description: Register an existing Artifacts repository in the project's namespace; it is
        unverified until `repositoryVerify`.
      properties:
        mode:
          type: string
          enum:
          - register
          description: Optional; the same request as omitting it.
        provider:
          type: string
          enum:
          - artifacts
        namespace:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,128}$
          description: Artifacts namespace, the `<namespace>` of `/git/<namespace>/<repo>.git`; not `.` or `..`.
            Optional - it defaults to the project's own namespace (`Project.artifactsNamespace`), the only one
            accepted; any other is 409 `repository-namespace-mismatch`.
        repoId:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,128}$
          description: Artifacts repository id; with `provider` and `namespace` unique across the deployment. Not `.`
            or `..`.
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[A-Za-z0-9._-]{1,120}$
          description: The Artifacts repository name (the provisioner forks task repositories from it), 1-120
            characters of `[A-Za-z0-9._-]`, not `.` or `..`. It also satisfies the project-name rules.
        targetRef:
          type: string
          pattern: ^refs/heads/.+
          description: The branch tasks land onto; `refs/heads/main` when omitted. A valid branch ref under `refs/heads/` (git check-ref-format
            rules), not under the reserved `refs/heads/oc/`.
        knownHeadSha:
          type: string
          pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
          description: Optional current head of `targetRef` (lowercase SHA-1 or SHA-256), recorded as a `seed`
            observation. Not verified against the provider.
      required:
      - provider
      - repoId
      - name
    Repository:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        projectId:
          $ref: '#/components/schemas/Id'
        provider:
          type: string
          enum:
          - artifacts
        namespace:
          type: string
        repoId:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
          - canonical
        targetRef:
          type: string
        knownHeadSha:
          anyOf:
          - $ref: '#/components/schemas/Sha'
          - type: 'null'
        importState:
          type: string
          enum:
          - importing
          description: Present only on an import's answer (mode `import`) - the import has started; follow it on
            `repositoriesList` (`importState`).
      required:
      - id
      - projectId
      - provider
      - namespace
      - repoId
      - name
      - role
      - targetRef
      - knownHeadSha
    RepositoryListItem:
      type: object
      additionalProperties: false
      description: A `Repository` as `GET /projects/{project}/repositories` lists it, with its verification state.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        projectId:
          $ref: '#/components/schemas/Id'
        provider:
          type: string
          enum:
          - artifacts
        namespace:
          type: string
        repoId:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
          - canonical
        targetRef:
          type: string
        knownHeadSha:
          anyOf:
          - $ref: '#/components/schemas/Sha'
          - type: 'null'
        verification:
          type: string
          enum:
          - verified
          - unverified
          - namespace-mismatch
          description: '`namespace-mismatch` exactly when claims, provisioning and broker credentials refuse the
            repository 409 `repository-namespace-mismatch`: an Artifacts repository outside the project''s own
            namespace (ADR 0017), whatever its verification history; it can never become `verified`. Otherwise
            `unverified` exactly when they refuse it 409 `repository-unverified`: it was registered through the API
            and not yet verified (`POST /projects/{project}/repositories/{repository}/verify`). A repository a trusted
            path created (provisioning, seed, migration, provider binding) in its project''s namespace, or a GitHub or
            Forgejo one, is `verified`.'
        verifiedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: When the registration was verified; null while `unverified` and for a repository a trusted
            path created. A verified `namespace-mismatch` repository keeps its timestamp.
        importState:
          anyOf:
          - type: string
            enum:
            - importing
            - ready
            - failed
          - type: 'null'
          description: Null unless Octocove imported the repository. `importing` - claims refuse 409
            `repository-importing`; `ready` - nothing to wait for; `failed` - claims refuse 409
            `repository-import-failed` (Artifacts lost the repository, or reported no content within an hour).
            An `importing` repository is reconciled from Artifacts on this read.
      required:
      - id
      - projectId
      - provider
      - namespace
      - repoId
      - name
      - role
      - targetRef
      - knownHeadSha
      - verification
      - verifiedAt
      - importState
    RepositoryVerification:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        projectId:
          $ref: '#/components/schemas/Id'
        provider:
          type: string
          enum:
          - artifacts
        namespace:
          type: string
        repoId:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
          - canonical
          - task
        binding:
          type: string
          enum:
          - verified
          - trusted
          description: '`verified` - registered through the API and bound by this route (or another trusted
            writer); `trusted` - created by a trusted path (provisioning, seed, migration), never unverified.'
        verifiedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        verifiedBy:
          anyOf:
          - type: string
          - type: 'null'
          description: The principal (`issuer|sub`) that verified the binding; null for a `trusted` binding.
      required:
      - id
      - projectId
      - provider
      - namespace
      - repoId
      - name
      - role
      - binding
      - verifiedAt
      - verifiedBy
    RepositoryList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/RepositoryListItem'
        creations:
          type: array
          maxItems: 100
          description: The project's open repository creations, oldest first (empty when none). Not repositories -
            nothing here can be claimed or targeted.
          items:
            $ref: '#/components/schemas/RepositoryCreation'
      required:
      - items
      - creations
    CodeTree:
      type: object
      additionalProperties: false
      description: One directory of the canonical repository at a ref.
      properties:
        repositoryId:
          $ref: '#/components/schemas/Id'
        ref:
          type: string
          description: The ref read - the `ref` given (a SHA lowercased) or the canonical target ref.
        commitSha:
          description: The commit read; null only for a target ref with no commit yet (an empty repository).
          oneOf:
          - $ref: '#/components/schemas/Sha'
          - type: 'null'
        path:
          type: string
          description: The normalised directory path, `""` for the root.
        entries:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/CodeTreeEntry'
        truncated:
          type: boolean
          description: The directory holds more than `entries` lists.
      required:
      - repositoryId
      - ref
      - commitSha
      - path
      - entries
      - truncated
    CodeTreeEntry:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        path:
          type: string
          description: Repository-relative path of the entry.
        type:
          type: string
          enum:
          - file
          - dir
          - symlink
          - submodule
        size:
          type: integer
          minimum: 0
          description: Bytes, for a file or symlink when Artifacts reports it.
      required:
      - name
      - path
      - type
    CodeBlob:
      type: object
      additionalProperties: false
      description: One file of the canonical repository at a ref, as data.
      properties:
        path:
          type: string
        commitSha:
          $ref: '#/components/schemas/Sha'
        size:
          type: integer
          minimum: 0
          description: The file's full size in bytes.
        binary:
          type: boolean
          description: A NUL byte in the first 8 KiB, or a chunk that is not UTF-8; `content` is then null.
        truncated:
          type: boolean
          description: The file is larger than 512 KiB; `content` (when text) is its first chunk.
        encoding:
          type: string
          const: utf-8
        content:
          type:
          - string
          - 'null'
      required:
      - path
      - commitSha
      - size
      - binary
      - truncated
      - encoding
      - content
    RepositoryCreation:
      type: object
      additionalProperties: false
      description: An open repository creation intent (`POST /projects/{project}/repositories` mode `create` or
        `import`; migration 0045) - it reserves its address, so a registration of the same name is 409
        `repository-creation-pending` while it is listed. Terminal intents (`committed` - it is the repository in
        `items`; `address-taken`; `abandoned`; `resolved` by the operator) are never listed. Carries display fields
        only - no import URL, Artifacts id or principal.
      properties:
        id:
          type: string
          description: Opaque; stable for the intent.
        name:
          type: string
          description: The repository name being created or imported.
        mode:
          type: string
          enum:
          - create
          - import
        state:
          type: string
          enum:
          - pending
          - needs-operator
          description: '`pending` - the request is in flight, or its outcome is not known yet and the creation sweep
            keeps reading Artifacts with backoff for a bounded window; it settles by itself. `needs-operator` - the request or the
            sweep could not prove the outcome (or could not record it); the address stays reserved until the
            service operator settles the intent by hand, which
            removes it from this list. A retry of the request does not settle it.'
        reason:
          type: string
          enum:
          - address-occupied
          - authority-lost
          - authority-revoked
          - canonical-exists
          - provider-unavailable
          - provider-unconfirmed
          - record-failed
          - repository-replaced
          description: '`needs-operator` only - why the request or the sweep handed it over (the `repository.creation_needs_operator`
            audit row''s reason). `address-occupied` - the create or import call was never made, yet a repository
            is at the address; `authority-lost` / `authority-revoked` - the requester''s sign-in or `project:admin` was lost
            before it could be recorded; `canonical-exists` - the project gained a canonical repository meanwhile;
            `provider-unavailable` / `provider-unconfirmed` - Artifacts never confirmed the repository within the
            window; `record-failed` - the repository exists but recording it kept failing; `repository-replaced` -
            Artifacts holds a different repository at the address. Clients treat an unknown value as needing the
            operator.'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - mode
      - state
      - createdAt
      - updatedAt
    MeMembership:
      type: object
      additionalProperties: false
      properties:
        projectId:
          $ref: '#/components/schemas/Id'
        slug:
          type: string
          description: The project's slug (`Project.slug`). A display field; it grants nothing.
        name:
          type: string
          description: The project's name (`Project.name`). A display field; it grants nothing.
        artifactsNamespace:
          description: The project's own Artifacts namespace (`Project.artifactsNamespace`, `oc-<id>`), or null for a
            legacy project row that has none. A display field; it grants nothing.
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{1,62}$
          - type: 'null'
        verbs:
          type: array
          description: Verbs exactly as stored, sorted.
          items:
            type: string
      required:
      - projectId
      - slug
      - name
      - artifactsNamespace
      - verbs
    MeProjectList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MeProject'
      required:
      - items
    MeProject:
      type: object
      additionalProperties: false
      properties:
        projectId:
          $ref: '#/components/schemas/Id'
        slug:
          type: string
          description: As `MeMembership.slug`.
        name:
          type: string
          description: As `MeMembership.name`.
        artifactsNamespace:
          description: As `MeMembership.artifactsNamespace`.
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{1,62}$
          - type: 'null'
        taskCounts:
          description: The project's tasks by status, every status present; null when the membership lacks `tasks:list`.
          anyOf:
          - $ref: '#/components/schemas/TaskCounts'
          - type: 'null'
        needsReview:
          description: Tasks the review queue lists, `candidate` or `approved` with an approval that no longer holds;
            null when the membership lacks `tasks:list`.
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        repository:
          description: The canonical repository's verification state; null when there is none (or the membership lacks
            `tasks:list`).
          anyOf:
          - type: object
            additionalProperties: false
            properties:
              verification:
                type: string
                enum:
                - verified
                - unverified
                - namespace-mismatch
                description: As `repositoriesList` `verification`.
            required:
            - verification
          - type: 'null'
      required:
      - projectId
      - slug
      - name
      - artifactsNamespace
      - taskCounts
      - needsReview
      - repository
    TaskCounts:
      type: object
      additionalProperties: false
      description: A count per task status (`Task.status`); every key is present.
      properties:
        draft:
          type: integer
          minimum: 0
        ready:
          type: integer
          minimum: 0
        claimed:
          type: integer
          minimum: 0
        submitted:
          type: integer
          minimum: 0
        candidate:
          type: integer
          minimum: 0
        approved:
          type: integer
          minimum: 0
        landing:
          type: integer
          minimum: 0
        landed:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        superseded:
          type: integer
          minimum: 0
      required:
      - draft
      - ready
      - claimed
      - submitted
      - candidate
      - approved
      - landing
      - landed
      - rejected
      - superseded
    RegistrationRequest:
      type: object
      additionalProperties: false
      properties:
        issuerUrl:
          anyOf:
          - type: string
            format: uri
          - type: 'null'
        clientId:
          type: string
        redirectUris:
          type: array
          items:
            type: string
          example:
          - https://app.octocove.com/auth/callback
        scopes:
          type: array
          items:
            type: string
        requiredCapabilities:
          type: array
          items:
            type: string
      required:
      - issuerUrl
      - clientId
      - redirectUris
      - scopes
      - requiredCapabilities
      description: Secret-free request. An unresolved issuer is null or an explicit placeholder; never pass placeholders
        to provider registration.
    StaleFenceDetails:
      description: '`stale-base` details from land when a landed receipt contradicts the approval''s base
        (docs/API.md, "Record verbs and async results", the landing paragraph). Pending: the evidence is ambiguous, nothing was written and the approval
        stays active; retry the same key after the named head re-read. Committed: the approval was
        invalidated by the receipt''s base move to `headSha`.'
      oneOf:
      - type: object
        additionalProperties: false
        required: [receiptId, pending, rereadRunId]
        properties:
          receiptId:
            $ref: '#/components/schemas/Id'
          pending:
            type: boolean
            const: true
          rereadRunId:
            $ref: '#/components/schemas/Id'
      - type: object
        additionalProperties: false
        required: [receiptId, headSha]
        properties:
          receiptId:
            $ref: '#/components/schemas/Id'
          headSha:
            $ref: '#/components/schemas/Sha'
    ProblemDetails:
      description: Details for codes other than `stale-base`. Only the listed fields are typed; other
        fields may appear and must be tolerated.
      type: object
      additionalProperties: true
      properties:
        reason:
          type: string
        currentBoundTo:
          anyOf:
          - $ref: '#/components/schemas/BoundTo'
          - type: 'null'
        claimAttemptId:
          $ref: '#/components/schemas/Id'
        claimResult:
          type: string
          enum:
          - refused-not-ready
          - refused-already-claimed
          - refused-dependency-unlanded
          - refused-unauthorized
          - refused-task-closed
        blockingTaskIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        candidateId:
          $ref: '#/components/schemas/Id'
        conflictFiles:
          type: array
          items:
            type: string
        fenceId:
          $ref: '#/components/schemas/Id'
        restartCursor:
          type: string
        registrationRequest:
          $ref: '#/components/schemas/RegistrationRequest'
        authenticatedAt:
          description: '`reauth-required` - when the caller''s sign-in last authenticated with the identity provider;
            null when unknown.'
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        reauthUrl:
          type: string
          description: '`reauth-required` - a path on this API, `/v1/auth/login?reauth=1&return_path=...`. POST it
            `{mode: "browser"}` with the pre-login binding cookie, the session cookie and an allowed Origin, as for a
            browser login; the issuer is asked for a fresh authentication and the same sign-in is refreshed.'

    ApprovalPrincipalRegistration:
      type: object
      additionalProperties: false
      required: [kind, expiresAt, trustBindings]
      properties:
        kind: {$ref: '#/components/schemas/ApproverKind'}
        identityId: {type: string, description: 'Human kind only, and required there: must equal issuer|subject from humanIdentity. Refused for policy_bot/workload, whose identity is server-assigned `<kind>:<principalId>`; a submit claim must carry the returned identityId as its actor ID.'}
        humanIdentity:
          type: object
          additionalProperties: false
          required: [issuer,subject]
          properties: {issuer: {type: string}, subject: {type: string}}
          description: Required only for human kind; current project membership required. Signed transport subject may differ. Human bindings stay inert until that human activates them (approvalTrustActivate).
        expiresAt: {type: string, format: date-time}
        trustBindings: {type: array, minItems: 1, maxItems: 16, items: {$ref: '#/components/schemas/ApprovalTrustBinding'}}
    TrustActivationState:
      type: string
      enum: [pending, not-required]
      description: Human trust bindings are pending until the bound human activates them; machine bindings need no activation.
    ApprovalTrustBinding:
      type: object
      additionalProperties: false
      required: [issuer, subject, algorithm, keyId, publicJwk, claims, variant, expiresAt]
      properties:
        issuer: {type: string, format: uri, description: Exact HTTPS issuer; no discovery or implicit issuer trust.}
        subject: {type: string, description: Exact subject; subject and key aliases preserve the same principal.}
        algorithm: {type: string, enum: [RS256, ES256, EdDSA]}
        keyId: {type: string}
        publicJwk: {type: object, additionalProperties: true, description: 'Public RSA >=2048 bits, P-256 or Ed25519 key. Private/symmetric keys refused.'}
        jwksUri: {type: string, format: uri, description: 'Exact public HTTPS location, required for github_actions and optional otherwise, whose origin the deployment allow-lists in MACHINE_JWKS_ALLOWED_ORIGINS (else 400 jwks-origin-not-allowed). Fetched only after the assertion verifies under publicJwk; the fetched key must ALSO match its thumbprint. Non-public DNS answers, redirects, bodies over 64 KiB and token key URLs refused.'}
        claims:
          type: object
          additionalProperties: {type: string}
          description: 'Exact literal claims. GitHub requires repository_id, repository, workflow_ref, ref, environment; verification also requires a numeric run_id. Cron requires worker_id and schedule. Scope claims, if supplied, must agree with the record. Registered issuer/subject/time/audience claims cannot be overridden here.'
        variant: {type: string, enum: [policy_bot, github_actions, workers_cron, signed_cli]}
        expiresAt: {type: string, format: date-time, description: 'No later than principal expiry; stored normalised to ISO-8601 UTC.'}
        requireScopedClaims: {type: boolean, default: false, description: 'Opt-in. When true, every exchange proof under this binding must carry a signed operation claim (approve or submit, matching the route) plus candidate_id for approval or task_id for submission, each equal to the record. When false (default), scope claims are compared only when present, as ADR 0001 describes; an operation claim, if present, must still name the route.'}
    ApprovalPolicyRegistration:
      type: object
      additionalProperties: false
      required: [principalId, repositoryId, sourceRepositoryId, targetRef, checkIdentity, acceptableEvidence, operations, allowMachine, version, expiresAt]
      properties:
        principalId: {type: [string, 'null'], description: Null is explicit target opt-in; otherwise registered principal ID.}
        repositoryId: {$ref: '#/components/schemas/Id'}
        sourceRepositoryId: {$ref: '#/components/schemas/Id'}
        targetRef: {type: string, description: 'Exact registered canonical target, no wildcards.'}
        checkIdentity: {type: string, description: 'Effective trusted record check-policy identity; exact match required, explicit no-check policy only.'}
        acceptableEvidence:
          type: object
          additionalProperties: false
          required: [version,requireSuccessfulCommands]
          properties: {version: {const: 1}, requireSuccessfulCommands: {const: true}}
          description: Required checks need a nonempty trusted executor v1 command envelope with every exit code zero. Explicit no-check candidate policies retain an empty run set.
        operations: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {type: string, enum: [submit, approve]}}
        allowMachine: {type: boolean, description: Approval/submit permission is intersected with target opt-in; default remains human-only.}
        version: {type: integer, minimum: 1}
        expiresAt: {type: string, format: date-time}
    SubmitGrantRequest:
      type: object
      additionalProperties: false
      required: [projectId, taskId, claimAttemptId, sourceSha, baseSha, intentVersion]
      properties:
        projectId: {$ref: '#/components/schemas/Id'}
        taskId: {$ref: '#/components/schemas/Id'}
        claimAttemptId: {$ref: '#/components/schemas/Id'}
        sourceSha: {type: string, pattern: '^[a-f0-9]{40,64}$'}
        baseSha: {type: string, pattern: '^[a-f0-9]{40,64}$'}
        intentVersion: {type: integer, minimum: 1}
    SubmitGrantCredential:
      type: object
      additionalProperties: false
      required: [id, principalId, expiresAt, scope, policyVersion]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        principalId: {$ref: '#/components/schemas/Id', description: Server-resolved canonical principal.}
        token: {type: string, description: 'Opaque single-use submit credential, returned once on the issuing exchange and absent from an idempotent retry; never log.'}
        expiresAt: {type: string, format: date-time}
        scope: {$ref: '#/components/schemas/SubmitGrantRequest'}
        policyVersion: {$ref: '#/components/schemas/Id'}
    ChainClaim:
      type: object
      additionalProperties: false
      required: [id, baseSha]
      properties:
        id: {type: string, pattern: '^[a-zA-Z0-9_-]{1,120}$'}
        baseSha: {type: string, pattern: '^[a-f0-9]{40}$'}
        previousTaskId: {$ref: '#/components/schemas/Id'}
      description: First base equals registered canonical head. Successors pin the preceding chain task accepted receipt SHA. Artifacts only; cannot combine with external source.
    ChainLane:
      type: object
      additionalProperties: false
      required: [chainId, claimAttemptId, strategy, phase, remote, baseSha, proofSha, pointerVersion, writerClaimId, leaseUntil, readiness, error, pushes]
      properties:
        chainId: {$ref: '#/components/schemas/Id'}
        claimAttemptId: {$ref: '#/components/schemas/Id'}
        strategy: {type: string, const: chain}
        phase: {type: string, enum: [pending, attached, retiring, retired], description: 'Chain lifecycle phase (ADR 0003): pending until its task repository is attached, attached while it serves the chain, retiring once a retire request passes the retention checks, retired after the task repository is released.'}
        remote: {type: string, description: URL only after exact proof; otherwise pending.}
        baseSha: {type: string}
        proofSha: {type: [string, 'null']}
        pointerVersion: {type: integer, minimum: 0}
        writerClaimId: {type: [string, 'null']}
        leaseUntil: {type: integer, description: 'End of the chain writer lease (the D1 one-writer window), in milliseconds since epoch. Not a credential.'}
        readiness: {type: string, enum: [not-ready, ready], description: 'Lane readiness (ADR 0003), derived. not-ready: this attempt is not yet attached at an exact proven ref, or at least one of its pushes is still remote-pending. ready: attached and every push delivered. Separate from phase and from push status.'}
        error: {type: [string, 'null']}
        pushes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [pushId, sourceSha, status, attempts, error]
            properties:
              pushId: {$ref: '#/components/schemas/Id'}
              sourceSha: {type: string}
              status: {type: string, enum: [remote-pending, delivered], description: 'Push status. remote-pending: queued and not yet delivered to the chain task repository (including exhausted jobs, which carry error). delivered: verified delivery acknowledged.'}
              attempts: {type: integer, minimum: 0, maximum: 5}
              error: {type: [string, 'null']}

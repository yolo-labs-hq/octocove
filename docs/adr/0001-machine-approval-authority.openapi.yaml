# Accepted ADR-0001 merge delta; shapes are merged into the public OpenAPI.
# Deep-merge maps; append new properties, not required fields, to legacy schemas.
# Base components/refs resolve in the merged document. ADR prose is normative.
x-status: accepted
x-adr: ./0001-machine-approval-authority.md
paths:
  /auth/approval-grants:
    post:
      operationId: approvalGrantExchange
      summary: Exchange verified identity proof for one exact approval grant
      description: Same error classification and idempotent retry rules as the decision route.
      security: [{ApprovalIdentityProof: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalGrantRequest'}}}
      responses:
        '201':
          description: Single-use grant; all relationship, policy and identity checks in ADR apply.
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalGrantCredential'}}}
        default: {$ref: '#/components/responses/Problem'}
  /candidates/{id}/approve-with-grant:
    post:
      operationId: candidateApproveWithGrant
      summary: Consume a grant and atomically record its exact approval
      description: No issuer JWT accepted. Returns 401 for invalid/expired proof or grant, 403 for denied authority or self-approval, 404 for invisible records, 409 for replay or changed tuple/checks/policy. Same-key identical authorized retries recover the original result.
      security: [{ApprovalGrant: []}]
      parameters:
      - {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalGrantRequest'}}}
      responses:
        '201':
          description: Approval with all proposed approval fields populated; kind comes from verified identity.
          content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}
        default: {$ref: '#/components/responses/Problem'}
  /auth/approval-grants/{id}/revoke:
    post:
      operationId: approvalGrantRevoke
      summary: Project administrator revokes grant authority, including unfenced approval
      description: Current human project admin required; preserves held fences. Same error classification as decision route.
      security: [{HumanSession: []}, {HumanCliSession: []}]
      parameters:
      - {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '204': {description: Revoked or already revoked; no duplicate logical audit.}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    ApprovalIdentityProof: {type: http, scheme: bearer, bearerFormat: Verified issuer JWT or registered-key assertion, description: Exchange only; ADR issuer/audience/expiry/replay checks mandatory.}
    ApprovalGrant: {type: http, scheme: bearer, bearerFormat: Opaque Octocove approval grant, description: One exact candidate and originating attempt; never submit or land authority.}
  schemas:
    ApprovalGrantRequest:
      type: object
      additionalProperties: false
      required: [projectId, claimAttemptId, candidateId, boundTo, checkRunIds]
      properties:
        projectId: {$ref: '#/components/schemas/Id'}
        claimAttemptId: {$ref: '#/components/schemas/Id'}
        candidateId: {$ref: '#/components/schemas/Id'}
        boundTo: {$ref: '#/components/schemas/BoundTo'}
        checkRunIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Id'}}
    ApprovalGrantCredential:
      type: object
      additionalProperties: false
      required: [id, expiresAt, scope, policyVersion]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        token: {type: string, description: Returned once, on the exchange that issued the grant; absent from an identical retry. Never log.}
        expiresAt: {type: string, format: date-time}
        scope: {$ref: '#/components/schemas/ApprovalGrantRequest'}
        policyVersion: {type: string, description: Immutable versioned policy record ID.}
    ApproverKind: {type: string, enum: [human, policy_bot, workload]}
    Approval: # Property additions only; retain all existing fields and required list.
      properties:
        approverKind: {$ref: '#/components/schemas/ApproverKind'}
        approvalGrantId: {$ref: '#/components/schemas/Id'}
        policyVersion: {type: string}
        evidenceRefs: {type: array, minItems: 1, items: {type: string}}
        checkRunIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Id'}}
        authorityExpiresAt: {type: string, format: date-time}
    Receipt:
      properties:
        approverKind: {$ref: '#/components/schemas/ApproverKind'}

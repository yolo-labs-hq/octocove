name: local chain walkthrough
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# Triggers and job gates are canonical text derived from the branch model in
# tools/check-ci-policy.py, which pins them (ADR 0012); the default model has no
# job gates. Pull requests run the jobs with an in-job area skip (tools/ci-scope.py).
jobs:
  demo:
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2 # the PR merge commit and both parents
      - name: Area scope (PRs skip untouched inputs; see tools/ci-scope.py)
        id: scope
        run: python3 tools/ci-scope.py '.github/workflows/demo.yml' 'tools/demo/**' 'tools/conformance/**' 'apps/control-plane/**' 'apps/integrator/**' 'packages/**' 'apps/*/package.json' 'package.json' 'pnpm-lock.yaml' 'pnpm-workspace.yaml' 'tsconfig.base.json' '.nvmrc'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
      - run: corepack enable
        if: steps.scope.outputs.run == 'true'
      - run: timeout 120 pnpm install --frozen-lockfile
        if: steps.scope.outputs.run == 'true'
      - run: timeout 360 pnpm demo:walkthrough
        if: steps.scope.outputs.run == 'true'
      - name: Stop and wipe (including failed walkthrough)
        if: always() && steps.scope.outputs.run == 'true'
        run: |
          timeout 20 pnpm demo:down
          test ! -e .demo
          for port in 8787 9999; do
            if timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/$port" 2>/dev/null; then
              echo "Demo port $port is still running"
              exit 1
            fi
          done
  # The same itinerary driven through @yolo-labs/octocove-client directly:
  # library conformance, bounded and with unconditional cleanup like the CLI-driven run above.
  demo-library:
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2 # the PR merge commit and both parents
      - name: Area scope (PRs skip untouched inputs; see tools/ci-scope.py)
        id: scope
        run: python3 tools/ci-scope.py '.github/workflows/demo.yml' 'tools/demo/**' 'tools/conformance/**' 'apps/control-plane/**' 'apps/integrator/**' 'packages/**' 'apps/*/package.json' 'package.json' 'pnpm-lock.yaml' 'pnpm-workspace.yaml' 'tsconfig.base.json' '.nvmrc'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
      - run: corepack enable
        if: steps.scope.outputs.run == 'true'
      - run: timeout 120 pnpm install --frozen-lockfile
        if: steps.scope.outputs.run == 'true'
      - run: timeout 360 pnpm demo:walkthrough --library
        if: steps.scope.outputs.run == 'true'
      - name: Stop and wipe (including failed walkthrough)
        if: always() && steps.scope.outputs.run == 'true'
        run: |
          timeout 20 pnpm demo:down
          test ! -e .demo
          for port in 8787 9999; do
            if timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/$port" 2>/dev/null; then
              echo "Demo port $port is still running"
              exit 1
            fi
          done

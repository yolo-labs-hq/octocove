name: integrator image
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: integrator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# Triggers and job gates are canonical text derived from the branch model in
# tools/check-ci-policy.py, which pins them (ADR 0012); the default model has no
# job gates. Pull requests run the jobs with an in-job area skip (tools/ci-scope.py).
jobs:
  native-git:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2 # the PR merge commit and both parents
      - name: Area scope (PRs skip untouched inputs; see tools/ci-scope.py)
        id: scope
        run: python3 tools/ci-scope.py '.github/workflows/integrator.yml' 'apps/integrator/**' 'packages/shared/**' '.nvmrc'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
      - run: node --test apps/integrator/tests/*.test.mjs
        if: steps.scope.outputs.run == 'true'
      - run: docker build -t octocove-integrator:ci apps/integrator
        if: steps.scope.outputs.run == 'true'
      - name: Image fails closed without runner credentials
        if: steps.scope.outputs.run == 'true'
        run: |
          printf '{"runId":"smoke","candidateId":"smoke","step":"candidate"}' > /tmp/octocove-job.json
          set +e
          docker run --rm -v /tmp/octocove-job.json:/job.json:ro octocove-integrator:ci /job.json
          code=$?
          test "$code" -eq 78

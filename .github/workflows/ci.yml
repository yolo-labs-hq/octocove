name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# Triggers and job gates are canonical text derived from the branch model in
# tools/check-ci-policy.py, which pins them (ADR 0012); the default model has no
# job gates and every pull request runs every job. `check` keeps `if: always()`;
# its requirement step carries the model's step gate, which is `always()` alone
# by default. Gate exemptions never apply to a fork PR's head.
jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Enforce secret-free required workflows and immutable actions
        run: python3 tools/check-ci-policy.py
      - name: Test workflow policy rejection cases
        run: python3 tools/test_ci_policy.py
      - name: Test command deadlines and child cleanup
        run: python3 -B tools/test_run_bounded.py
  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Evidence links resolve (line and heading anchors in docs and published Markdown; titled code anchors)
        run: python3 -B tools/check-evidence-links.py
      - name: Test evidence link check rejection cases
        run: python3 -B tools/test_check_evidence_links.py
      - name: Test evidence link reanchor tool
        run: python3 -B tools/test_reanchor_evidence_links.py
  events-conformance-local:
    name: events conformance (local oracles)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Event oracle and fault protocol tests (small fixtures, no timing gates)
        run: node --test --test-concurrency=1 tools/conformance/events/events.test.mjs
      - name: Record local timings and per-cell verdicts
        run: node tools/conformance/events/cli.mjs local .evidence/events-local
      - name: Upload local event evidence (never live qualification)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-events-local
          path: .evidence/events-local/*.json
          if-no-files-found: error
  check-shards:
    name: check (${{ matrix.suite }})
    runs-on: ubuntu-latest
    # About 2x the slowest measured shard job (387s; see CONTRIBUTING.md).
    # CI_JOB_BUDGET_SECONDS below must equal this, in seconds.
    timeout-minutes: 13
    strategy:
      fail-fast: false
      matrix:
        suite: [other-packages, control-plane-1, control-plane-2, control-plane-3, control-plane-4]
    env:
      CI: "1"
      CI_JOB_BUDGET_SECONDS: "780"
    steps:
      - name: Start job budget clock
        run: echo "CI_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies inside setup budget
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = other-packages ]; then
            timeout --kill-after=10 180 pnpm install --frozen-lockfile < /dev/null
          else
            timeout --kill-after=10 180 pnpm --filter @octocove/control-plane... install --frozen-lockfile < /dev/null
          fi
      - name: Record invariants in sync with test list
        if: matrix.suite == 'other-packages'
        run: pnpm check:invariants
      - name: Typecheck
        if: matrix.suite == 'other-packages'
        run: |
          (while true; do echo "typecheck heartbeat $(date -u +%T)"; sleep 30; done) &
          hb=$!
          timeout 600 pnpm -r typecheck < /dev/null; rc=$?
          kill $hb; exit $rc
      - name: Test other packages
        if: matrix.suite == 'other-packages'
        # Each package keeps its own budget; no timeout around the workspace.
        # packages/client runs in its own client job (Node + workerd).
        run: pnpm -r --filter '!@octocove/control-plane' --filter '!./packages/client' test < /dev/null
      - name: Upload local workspace cache measurements
        if: always() && matrix.suite == 'other-packages'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-workspace-cache-measurements
          path: packages/cli/test-results/workspace-cache/*.json
          if-no-files-found: ignore
      - name: Test control-plane shard
        if: matrix.suite != 'other-packages'
        env:
          SUITE: ${{ matrix.suite }}
        # DurationShardSequencer balances measured file times across four shards
        # (test-durations.json: mean measured module times from ci-timings.json).
        # Tests are capped at 600s; the supervisor trims that cap so 80s of the
        # 780s job clock remain for cleanup and artifact upload if setup runs long.
        # Module timings include hooks; explicit fixture setup/dispose is also recorded.
        run: pnpm --filter @octocove/control-plane test --shard="${SUITE##*-}/4" --maxWorkers=2 --reporter=default --reporter=verbose --reporter=./ci-timing-reporter.ts < /dev/null
      - name: Upload shard timings even on failure
        if: always() && matrix.suite != 'other-packages'
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timings-${{ matrix.suite }}
          path: test-results/ci-timings.json
          if-no-files-found: warn
  # The client package alone (no workspace build). Unit cases under Node 22 and inside a
  # workerd isolate, generation/routing/retry-policy drift checks, and the npm pack tarball that
  # consumers pin by commit SHA (no registry publish).
  client:
    name: client (node 22 + workerd, drift, pack)
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      CI: "1"
    steps:
      # The reviewed head itself, not the PR merge commit: what is tested and packed is exactly the
      # SHA the artifact is named after (smoke-pack asserts HEAD matches CLIENT_PACK_SHA).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the client's dependency slice
        run: timeout --kill-after=10 180 pnpm --filter ./packages/client install --frozen-lockfile < /dev/null
      - name: Generated types and routing are current (pinned generator)
        run: timeout 120 pnpm --filter ./packages/client check:generated < /dev/null
      - name: Retry policy covers every operation once, in the declared shapes
        run: timeout 60 pnpm --filter ./packages/client check:policy < /dev/null
      - name: Unit tests (Node 22)
        run: pnpm --filter ./packages/client test < /dev/null
      - name: Unit tests inside a workerd isolate
        run: pnpm --filter ./packages/client test:workerd < /dev/null
      - name: Conformance Git adapter stops at the journey's signal and deadline (scripted git, no runtime)
        run: timeout 120 node --test --test-concurrency=1 tools/demo/library-driver.test.mjs < /dev/null
      - name: Build and smoke-import the npm pack tarball
        env:
          # The checked-out reviewed head; the tarball and the artifact both carry it.
          CLIENT_PACK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pnpm --filter ./packages/client build < /dev/null
          timeout 120 pnpm --filter ./packages/client smoke:pack < /dev/null
      - name: Upload the pinned client artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: octocove-client-${{ github.event.pull_request.head.sha || github.sha }}
          path: packages/client/pack-out/*-${{ github.event.pull_request.head.sha || github.sha }}.tgz
          if-no-files-found: error
  # Builds @yolo-labs/octocove and @yolo-labs/octocove-client as npm-publish.yml
  # would. Required through check; a PR whose diff misses its inputs skips
  # the steps in-job and reports success.
  npm-pack:
    name: npm tarball gate (cli + client)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2 # the PR merge commit and both parents
      - name: Area scope (PRs skip untouched inputs; see tools/ci-scope.py)
        id: scope
        run: python3 tools/ci-scope.py '.github/workflows/ci.yml' 'packages/cli/**' 'packages/client/**' 'packages/shared/**' 'LICENSE' 'NOTICE' 'package.json' 'pnpm-lock.yaml' 'pnpm-workspace.yaml' 'tsconfig.base.json' '.nvmrc'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: steps.scope.outputs.run == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the CLI and client dependency slice
        if: steps.scope.outputs.run == 'true'
        run: timeout --kill-after=10 180 pnpm --filter ./packages/cli --filter ./packages/client install --frozen-lockfile < /dev/null
      - name: Build both packages (the CLI bundles the client and shared sources)
        if: steps.scope.outputs.run == 'true'
        run: |
          timeout 120 pnpm --filter ./packages/cli build < /dev/null
          pnpm --filter ./packages/client build < /dev/null
  # Preserve the required status name, including failure/cancellation of a shard.
  # `if: always()` is pinned (conformance smoke test, check-ci-policy.py): check
  # always reports. Where the branch model gates every need off a PR, the step
  # gate skips the requirement step too and check reports success; everywhere
  # else that step runs (always(), so a cancelled run cannot skip it into a green
  # check) and rejects any non-success.
  check:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [check-shards, client, npm-pack, events-conformance-local, workflow-policy, repo-hygiene, conformance]
    steps:
      - name: Require every check dependency to pass
        if: ${{ always() }}
        env:
          SHARD_RESULT: ${{ needs.check-shards.result }}
          HYGIENE_RESULT: ${{ needs.repo-hygiene.result }}
          POLICY_RESULT: ${{ needs.workflow-policy.result }}
          EVENTS_RESULT: ${{ needs.events-conformance-local.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          CLIENT_RESULT: ${{ needs.client.result }}
          NPM_PACK_RESULT: ${{ needs.npm-pack.result }}
        run: |
          test "$SHARD_RESULT" = success
          test "$EVENTS_RESULT" = success
          test "$CONFORMANCE_RESULT" = success
          test "$CLIENT_RESULT" = success
          test "$NPM_PACK_RESULT" = success
          test "$POLICY_RESULT" = success
          test "$HYGIENE_RESULT" = success
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2 # the PR merge commit and both parents
      - name: Area scope (PRs skip untouched inputs; see tools/ci-scope.py)
        id: scope
        run: python3 tools/ci-scope.py '.github/workflows/ci.yml' 'apps/control-plane/migrations/**' 'apps/control-plane/wrangler.jsonc' 'apps/control-plane/package.json' 'tools/check-migration-prefixes.mjs' 'apps/*/package.json' 'packages/*/package.json' 'package.json' 'pnpm-lock.yaml' 'pnpm-workspace.yaml' 'tsconfig.base.json' '.nvmrc'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: steps.scope.outputs.run == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: timeout 300 pnpm install --frozen-lockfile < /dev/null
        if: steps.scope.outputs.run == 'true'
      - name: Reject duplicate migration prefixes
        if: steps.scope.outputs.run == 'true'
        run: node tools/check-migration-prefixes.mjs
      - name: Apply every migration to a fresh local D1
        if: steps.scope.outputs.run == 'true'
        run: pnpm db:reset:local < /dev/null
  openapi-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2 # the PR merge commit and both parents
      - name: Area scope (PRs skip untouched inputs; see tools/ci-scope.py)
        id: scope
        run: python3 tools/ci-scope.py '.github/workflows/ci.yml' 'apps/control-plane/openapi.yaml' '.nvmrc'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
      - run: npx --yes @redocly/cli@2.58.1 lint apps/control-plane/openapi.yaml < /dev/null
        if: steps.scope.outputs.run == 'true'

  # Required through check on every push and pull request. Every push runs it; a
  # PR whose diff misses its inputs skips the steps in-job and reports success.
  # One local smoke cell per pairing; full qualification matrix stays out of CI.
  conformance:
    name: conformance smoke (a / ${{ matrix.pairing }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pairing: [artifacts/ref, artifacts/repo, github/ref, forgejo/ref]
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2 # the PR merge commit and both parents
      - name: Area scope (PRs skip untouched inputs; see tools/ci-scope.py)
        id: scope
        run: python3 tools/ci-scope.py '.github/workflows/ci.yml' 'tools/conformance/**' 'apps/control-plane/**' 'apps/integrator/**' 'packages/**' 'apps/*/package.json' 'package.json' 'pnpm-lock.yaml' 'pnpm-workspace.yaml' 'tsconfig.base.json' '.nvmrc'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: steps.scope.outputs.run == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install harness dependency slice
        if: steps.scope.outputs.run == 'true'
        run: timeout 180 pnpm --filter @octocove/control-plane... --filter @yolo-labs/octocove install --frozen-lockfile < /dev/null
      - name: Validate conformance protocol
        if: steps.scope.outputs.run == 'true'
        run: node --test --test-concurrency=1 tools/conformance/protocol.test.mjs tools/conformance/smoke.test.mjs tools/conformance/aggregate.test.mjs
      - name: Require one local smoke cell (one worker, five minute deadline)
        if: steps.scope.outputs.run == 'true'
        env:
          PAIRING: ${{ matrix.pairing }}
        run: pnpm conformance:shard --mode local --archetype a --pairing "$PAIRING" --smoke --ci-gate --timeout-seconds 300 --maxWorkers=1 --out .conformance/local/summary.json < /dev/null
      - name: Upload summary and preregistration even on failure
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-smoke-${{ strategy.job-index }}-${{ github.sha }}
          path: .conformance/local/*.json
          if-no-files-found: error

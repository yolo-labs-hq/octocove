name: "Feature request"
description: "Propose a change within the substrate scope."
title: "[feature] "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use [private reporting](https://github.com/yolo-labs-hq/octocove/security/advisories/new), not this public form. Remove secrets, personal data, absolute operator paths and private identifiers."
  - type: textarea
    id: problem
    attributes:
      label: "Problem and archetypes"
      description: "Who needs this: Studio adapter, own-clone CLI agent, or CI/policy-bot? Describe the concrete problem."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposal and scope"
      description: "Describe behavior, alternatives, and what this does not do. Check the glossary scope fence."
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: "Service or API impact"
      description: "Say whether the change needs the service or its API to change (a new noun, state or write route). Client-only changes say none."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Acceptance evidence"
      description: "Propose bounded single-file checks; distinguish local from live qualification. Do not claim unrun evidence."
    validations:
      required: false

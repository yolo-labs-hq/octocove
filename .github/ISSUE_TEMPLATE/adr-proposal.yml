name: "ADR proposal"
description: "Propose a new noun, state or public write route."
title: "[adr] "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use [private reporting](https://github.com/yolo-labs-hq/octocove/security/advisories/new), not this public form. Remove secrets, personal data, absolute operator paths and private identifiers."
  - type: textarea
    id: need
    attributes:
      label: "Need and archetypes"
      description: "Describe the problem and affected archetypes; Studio convenience alone is insufficient."
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: "Proposed decision"
      description: "Use docs/GLOSSARY.md ADR template and the next docs/adr/NNNN-slug.md number; link a draft if available."
    validations:
      required: true
  - type: textarea
    id: delta
    attributes:
      label: "Contract delta"
      description: "List new nouns/states/write routes and glossary, OpenAPI/API and record updates required together."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Scope and alternatives"
      description: "What does this not do? Explain alternatives and consequences."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: "Qualification plan"
      description: "Name bounded tests and evidence requirements, including date/revision/local-live scope; identify unproven limits."
    validations:
      required: true
